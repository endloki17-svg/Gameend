<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RIVALS CLONE - V7 ULTIMATE CLIENT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Teko:wght@500;700&display=swap');

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0b0c10; font-family: 'Noto Sans KR', sans-serif; color: #dfe6e9;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }

    .ui-layer {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(11,12,16,0.85), rgba(0,0,0,0.96));
      z-index: 20;
    }
    .hidden { display: none !important; }

    .panel {
      background: rgba(31, 40, 51, 0.96);
      border: 2px solid #66fcf1;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      width: min(90vw, 560px);
      padding: 40px 28px;
      text-align: center;
    }

    h1 {
      font-family: 'Teko', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 4px;
      margin: 0;
      color: #66fcf1;
      text-shadow: 0 0 30px rgba(102, 252, 241, 0.5);
      line-height: 1;
    }

    h2 {
      font-size: 2rem; margin: 0 0 18px; color: #ffffff;
    }

    p {
      font-size: 1.05rem; line-height: 1.6; color: #b6c0d1;
      margin: 16px 0;
    }

    input {
      width: 85%; max-width: 360px;
      padding: 18px 16px;
      border-radius: 12px;
      border: 2px solid #45a29e;
      background: #0b0c10;
      color: #66fcf1;
      font-size: 1.3rem;
      text-align: center;
      outline: none;
      margin: 12px 0;
    }
    input:focus {
      border-color: #66fcf1;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
    }

    button {
      display: inline-block;
      width: min(88%, 380px);
      padding: 18px 22px;
      border: none;
      border-radius: 12px;
      background: #c5c6c7;
      color: #0b0c10;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.12s ease;
      box-shadow: 0 6px 0 rgba(136,146,176,1);
      margin: 10px 0;
      font-family: 'Noto Sans KR', sans-serif;
    }
    button:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(136,146,176,1); }
    button:hover { opacity: 0.96; }

    .btn-primary { background: #66fcf1; color: #0b0c10; box-shadow: 0 6px 0 #45a29e; }
    .btn-danger { background: #ff3366; color: white; box-shadow: 0 6px 0 #cc0033; }

    .top-bar {
      position: absolute;
      top: 18px; right: 18px; z-index: 30;
      background: rgba(11,12,16,0.9);
      border: 2px solid #45a29e;
      border-radius: 14px;
      padding: 12px 22px;
      font-size: 2rem;
      font-family: 'Teko', sans-serif;
    }

    #dashboard-container {
      width: min(1200px, 100%);
      height: 100%;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .dash-nav {
      display: flex; justify-content: space-around; gap: 12px;
      background: rgba(31,40,51,0.9);
      border: 1px solid #45a29e;
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .dash-nav-item {
      flex: 1; text-align: center; padding: 12px 18px; border-radius: 12px;
      cursor: pointer; color: #8892b0; font-weight: 700; transition: .2s;
    }
    .dash-nav-item.active {
      background: #66fcf1; color: #0b0c10; box-shadow: 0 0 18px rgba(102,252,241,.35);
    }

    .dash-content {
      flex: 1; background: rgba(31,40,51,0.95); border:1px solid #45a29e; border-radius: 16px;
      padding: 28px; overflow-y: auto;
      box-sizing: border-box;
    }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .store-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px;
      margin-top: 16px;
    }
    .store-item {
      background: #0b0c10; border: 2px solid #1f2833; border-radius: 14px;
      padding: 20px 14px; text-align: center; cursor: pointer;
      transition: .2s ease;
    }
    .store-item:hover { border-color: #66fcf1; transform: translateY(-3px); }
    .store-item.locked { opacity: 0.5; }
    .store-item.equipped { border-color: #ff3366; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="top-bar hidden" id="top-bar">
    <span>🗝️</span><span id="ui-keys">0</span>
  </div>

  <div id="login-ui" class="ui-layer">
    <div class="panel">
      <h1>RIVALS</h1>
      <p>
        <b>[ 초고해상도 100+ 무기 클라이언트 ]</b><br><br>
        요원의 호출 부호를 입력하고<br>
        아레나 네트워크에 동기화하십시오.
      </p>
      <input id="username-input" type="text" maxlength="8" placeholder="호출 부호 (최대 8자)" />
      <button id="btn-login" class="btn-primary">시스템 접속</button>
    </div>
  </div>

  <div id="lobby-ui" class="ui-layer hidden">
    <div id="dashboard-container">
      <div class="dash-nav">
        <div class="dash-nav-item active" data-tab="play">매치메이킹</div>
        <div class="dash-nav-item" data-tab="store">블랙 마켓</div>
        <div class="dash-nav-item" data-tab="profile">요원 기록</div>
      </div>

      <div class="dash-content">
        <div id="tab-play" class="tab-section active" style="text-align:center;">
          <h1 style="font-size: clamp(2.5rem, 5vw, 5rem);">ARENA HUB</h1>
          <p>아레나에 진입해 적을 처치하고 열쇠를 획득하십시오.</p>
          <div style="margin-top: 26px; background: rgba(0,0,0,0.32); border-radius:16px; padding:26px;">
            <button id="btn-create-room" class="btn-danger">⚔️ 방 생성 및 호스트</button>
            <p style="margin: 20px 0; color:#66fcf1; font-weight:700;">===== OR =====</p>
            <input id="room-code-input" type="text" maxlength="3" placeholder="초대 코드 입력" style="max-width:260px; font-size:1.5rem; text-transform:uppercase;" />
            <br />
            <button id="btn-join-room">방 참가하기</button>
          </div>
        </div>

        <div id="tab-store" class="tab-section">
          <h2>블랙 마켓 무기고</h2>
          <p>열쇠로 스킨과 무기를 해금할 수 있습니다.</p>
          <div id="store-grid" class="store-grid"></div>
        </div>

        <div id="tab-profile" class="tab-section">
          <h2>요원 전투 기록</h2>
          <div style="background:#0b0c10; border:1px solid #45a29e; border-radius:14px; padding:26px;">
            <div style="font-size:1.3rem; margin-bottom:16px;">호출 부호: <span id="prof-name" style="color:#66fcf1; font-weight:900;">---</span></div>
            <div style="font-size:1.3rem; margin-bottom:16px;">누적 처치 수: <span id="prof-kills" style="color:#ff3366; font-weight:900;">0</span> Kills</div>
            <div style="font-size:1.3rem;">누적 열쇠 획득: <span id="prof-keys" style="color:#ffcc00; font-weight:900;">0</span> Keys</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GameState = {
      username: '',
      keys: 0,
      kills: 0,
      totalKeys: 0,
      unlockedWeapons: [0],
      currentWeapon: 0,
      isOffline: true
    };

    function updateTopKeys() {
      const el = document.getElementById('ui-keys');
      if (el) el.textContent = String(GameState.keys);
    }

    function renderStore() {
      const grid = document.getElementById('store-grid');
      if (!grid) return;

      const sampleWeapons = [
        { id: 0, name: '기본 권총', cost: 0, active: true },
        { id: 1, name: '네온 돌격소총', cost: 15 },
        { id: 2, name: '카본 저격총', cost: 30 },
        { id: 3, name: '사막 산탄총', cost: 45 },
        { id: 4, name: '카타나', cost: 60 }
      ];

      grid.innerHTML = '';
      sampleWeapons.forEach((wp, idx) => {
        const unlocked = GameState.unlockedWeapons.includes(wp.id);
        const active = GameState.currentWeapon === wp.id;
        const item = document.createElement('div');
        item.className = 'store-item' + (!unlocked ? ' locked' : '') + (active ? ' equipped' : '');
        item.innerHTML = `
          <div style="font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 10px;">${wp.name}</div>
          <div style="font-size: 0.9rem; color:#66fcf1; text-transform: uppercase; margin-bottom: 12px;">${active ? '장착 중' : (unlocked ? '장비 가능' : '잠금')}</div>
          ${!unlocked ? `<div style="font-size: 1.6rem; color:#ffcc00; font-family:'Teko';">🗝️ ${wp.cost}</div>` : ''}
        `;

        item.addEventListener('click', () => {
          if (!unlocked) {
            if (GameState.keys >= wp.cost) {
              GameState.keys -= wp.cost;
              GameState.unlockedWeapons.push(wp.id);
              GameState.currentWeapon = wp.id;
              updateTopKeys();
              renderStore();
            } else {
              alert('열쇠가 부족합니다.');
            }
            return;
          }

          GameState.currentWeapon = wp.id;
          renderStore();
        });

        grid.appendChild(item);
      });
    }

    function switchTab(tabName, event) {
      document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dash-nav-item').forEach(el => el.classList.remove('active'));

      const section = document.getElementById(`tab-${tabName}`);
      if (section) section.classList.add('active');

      const nav = event && event.currentTarget ? event.currentTarget : document.querySelector(`.dash-nav-item[data-tab="${tabName}"]`);
      if (nav) nav.classList.add('active');

      if (tabName === 'profile') {
        document.getElementById('prof-name').textContent = GameState.username || '---';
        document.getElementById('prof-kills').textContent = String(GameState.kills);
        document.getElementById('prof-keys').textContent = String(GameState.totalKeys);
      }

      if (tabName === 'store') renderStore();
    }

    function doLogin() {
      const input = document.getElementById('username-input');
      const name = (input ? input.value : '').trim();
      if (!name) {
        alert('호출 부호를 입력하십시오.');
        if (input) input.focus();
        return;
      }

      GameState.username = name;
      GameState.isOffline = true;
      updateTopKeys();

      document.getElementById('login-ui').classList.add('hidden');
      document.getElementById('lobby-ui').classList.remove('hidden');
      document.getElementById('top-bar').classList.remove('hidden');
      document.getElementById('prof-name').textContent = GameState.username;
      renderStore();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btnLogin = document.getElementById('btn-login');
      if (btnLogin) {
        btnLogin.addEventListener('click', doLogin);
      }

      const input = document.getElementById('username-input');
      if (input) {
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') doLogin();
        });
      }

      document.querySelectorAll('.dash-nav-item').forEach((item) => {
        item.addEventListener('click', (event) => switchTab(item.dataset.tab, event));
      });

      document.getElementById('btn-create-room')?.addEventListener('click', () => {
        alert('오프라인 모드: 로컬 데모 실행');
      });

      document.getElementById('btn-join-room')?.addEventListener('click', () => {
        const roomCode = document.getElementById('room-code-input')?.value?.trim() || '';
        if (!roomCode) {
          alert('초대 코드를 입력하십시오.');
          return;
        }
        alert('입력된 방 코드: ' + roomCode + ' (오프라인 데모)');
      });

      updateTopKeys();
      renderStore();
    });

    window.switchTab = switchTab;
  </script>
</body>
</html>
