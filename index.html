<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA NEON STRIKE - PRO VERSION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; color: #fff; user-select: none; touch-action: none; -webkit-touch-callout: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 공통 UI */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5,5,15,0.9); backdrop-filter: blur(10px); transition: 0.3s; }
        .hidden { display: none !important; }
        .panel { background: rgba(10, 15, 30, 0.85); border: 2px solid #0ff; border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0,255,255,0.1); width: 85%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        
        h1 { font-size: 2.5rem; text-shadow: 0 0 20px #0ff, 0 0 40px #0ff; margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; }
        h2 { font-size: 1.5rem; color: #f0f; text-shadow: 0 0 10px #f0f; }
        input { width: 80%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 2px solid #0ff; border-radius: 8px; color: #fff; font-size: 1.2rem; text-align: center; outline: none; font-family: inherit; transition: 0.2s; }
        input:focus { box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        button { width: 85%; padding: 15px; margin: 10px 0; background: linear-gradient(90deg, #00ffff, #ff00ff); border: none; border-radius: 8px; color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: inherit; box-shadow: 0 0 15px rgba(0,255,255,0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-gacha { background: linear-gradient(90deg, #ffd700, #ff4500); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px #ffd700; } 50% { box-shadow: 0 0 30px #ffd700; } 100% { box-shadow: 0 0 10px #ffd700; } }

        /* 인게임 HUD */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; border: 2px solid rgba(0, 255, 255, 0.7); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; transition: 0.2s; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #0ff; border-radius: 50%; transform: translate(-50%, -50%); }
        #hitmarker { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); z-index: 6; opacity: 0; transition: opacity 0.1s; background-image: linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%); filter: drop-shadow(0 0 5px #fff); }
        
        #hud-bottom-left { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-size: 1.2rem; text-shadow: 0 0 10px #0ff; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; border-left: 4px solid #0ff; }
        #hud-bottom-right { position: absolute; bottom: 20px; right: 20px; z-index: 10; font-size: 2.5rem; font-weight: 900; text-shadow: 0 0 15px #f0f; text-align: right; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; border-right: 4px solid #f0f; }
        #hud-top-right { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; width: 220px; font-size: 0.9rem; border-top: 2px solid #0ff; }
        #killfeed { list-style: none; padding: 0; margin: 0; color: #fff; }
        
        /* 인벤토리 UI */
        #inventory-ui { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .inv-item { background: rgba(255,255,255,0.1); border: 1px solid #555; padding: 10px; border-radius: 5px; cursor: pointer; width: 40%; font-size: 0.9rem; transition: 0.2s; }
        .inv-item:hover { background: rgba(255,255,255,0.2); }
        .inv-item.equipped { border-color: #0ff; background: rgba(0,255,255,0.3); box-shadow: 0 0 15px #0ff; }

        /* 피격 효과 */
        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.6) 100%); z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        
        /* 모바일 터치 컨트롤러 */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; display: none; }
        .touch-btn { position: absolute; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; color: rgba(255,255,255,0.7); backdrop-filter: blur(2px); transition: 0.1s; }
        
        #joystick-zone { bottom: 40px; left: 40px; width: 140px; height: 140px; border-color: rgba(0,255,255,0.3); }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #0ff; }
        
        #shoot-btn { bottom: 40px; right: 40px; width: 90px; height: 90px; border-color: #ff0; color: #ff0; text-shadow: 0 0 10px #ff0; box-shadow: 0 0 20px rgba(255,255,0,0.2); font-size: 1.2rem; }
        #aim-btn { bottom: 150px; right: 40px; width: 65px; height: 65px; border-color: #0f0; color: #0f0; }
        #jump-btn { bottom: 40px; right: 150px; width: 65px; height: 65px; border-color: #f0f; color: #f0f; }
        #reload-btn { bottom: 120px; right: 120px; width: 65px; height: 65px; }
        
        /* 화면 회전 영역 */
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 70%; pointer-events: auto; }

        .grade-legendary { color: #ffd700; text-shadow: 0 0 15px #ffd700; }
        .grade-epic { color: #a335ee; text-shadow: 0 0 15px #a335ee; }
        .grade-rare { color: #0070dd; text-shadow: 0 0 15px #0070dd; }
        .grade-normal { color: #ffffff; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- UI 계층 (접속) -->
    <div id="login-ui" class="ui-layer">
        <div class="panel">
            <h1>NEON STRIKE</h1>
            <p style="color: #aaa; margin-bottom: 20px;">[ v2.0 Pro Edition ]</p>
            <input type="text" id="username-input" placeholder="요원 이름 입력" maxlength="8">
            <button onclick="login()">서버 접속</button>
        </div>
    </div>

    <!-- UI 계층 (로비) -->
    <div id="lobby-ui" class="ui-layer hidden">
        <div class="panel">
            <h2 id="welcome-msg">작전 통제실</h2>
            <button onclick="showGacha()" class="btn-gacha">✨ 최고급 무기 보급 ✨</button>
            <button onclick="showInventory()">🎒 내 장비창 (인벤토리)</button>
            <hr style="border-color: rgba(0,255,255,0.3); margin: 25px 0;">
            <button onclick="createRoom()">새 방 만들기</button>
            <input type="text" id="room-code-input" placeholder="초대 코드 (3자리)" maxlength="3" style="text-transform: uppercase;">
            <button onclick="joinRoom()">방 참가하기</button>
        </div>
    </div>

    <!-- UI 계층 (가챠) -->
    <div id="gacha-ui" class="ui-layer hidden">
        <div class="panel">
            <h2>무기 보급소</h2>
            <div id="gacha-result" style="font-size: 1.8rem; font-weight: bold; margin: 30px 0; min-height: 40px;">대기중...</div>
            <button onclick="pullGacha()" class="btn-gacha">무기 뽑기 진행</button>
            <button onclick="hideGacha()" style="background: rgba(255,255,255,0.1); border: 1px solid #555;">로비로 복귀</button>
        </div>
    </div>

    <!-- UI 계층 (인벤토리) -->
    <div id="inventory-ui-panel" class="ui-layer hidden">
        <div class="panel" style="max-width: 600px;">
            <h2>내 장비창</h2>
            <div id="inventory-ui"></div>
            <button onclick="hideInventory()" style="background: rgba(255,255,255,0.1); border: 1px solid #555; margin-top: 25px;">닫기</button>
        </div>
    </div>

    <!-- UI 계층 (대기실) -->
    <div id="room-ui" class="ui-layer hidden">
        <div class="panel">
            <h2>작전 대기실</h2>
            <p style="color: #aaa;">상대방에게 아래 코드를 알려주세요</p>
            <div id="room-code-display" style="font-size: 3.5rem; color: #0ff; letter-spacing: 15px; margin: 20px 0; text-shadow: 0 0 20px #0ff;">---</div>
            <p id="connection-status" style="color: #f0f; font-weight: bold;">통신 대기 중...</p>
            <button id="btn-start-game" onclick="startGame()" style="display: none; margin-top: 20px;">작전 개시</button>
        </div>
    </div>

    <!-- UI 계층 (사망/부활) -->
    <div id="respawn-ui" class="ui-layer hidden" style="background: rgba(20,0,0,0.9);">
        <h1 style="color: #f00; font-size: 5rem; text-shadow: 0 0 40px #f00;">YOU DIED</h1>
        <p id="respawn-timer" style="font-size: 2.5rem; font-weight: bold;">3초 후 부활...</p>
    </div>

    <!-- 인게임 HUD -->
    <div id="game-ui" class="hidden">
        <div id="damage-overlay"></div>
        <div id="crosshair"></div>
        <div id="hitmarker"></div>
        
        <div id="hud-bottom-left">
            <span id="hud-name">Player</span><br>
            HP: <span id="hud-hp" style="color:#0f0; font-weight:bold; font-size:1.5rem;">100</span><br>
            <span id="hud-weapon" style="color:#aaa;">기본 총</span>
        </div>
        <div id="hud-bottom-right">
            <span id="hud-ammo">0</span> <span style="font-size:1.2rem; color:#888;">/ <span id="hud-maxammo">0</span></span>
        </div>
        <div id="hud-top-right">
            <ul id="killfeed"></ul>
            <div style="margin-top: 10px; border-top: 1px solid rgba(0,255,255,0.3); padding-top: 8px;">My Kills: <span id="hud-kills" style="color:#0ff; font-weight:bold;">0</span></div>
        </div>
        
        <!-- 모바일 가상 컨트롤러 -->
        <div id="mobile-controls">
            <div id="look-zone"></div>
            <div id="joystick-zone" class="touch-btn"><div id="joystick-knob"></div></div>
            <div id="shoot-btn" class="touch-btn">FIRE</div>
            <div id="aim-btn" class="touch-btn">AIM</div>
            <div id="jump-btn" class="touch-btn">JUMP</div>
            <div id="reload-btn" class="touch-btn">RELOAD</div>
        </div>
    </div>
    
    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.158.0';
        import { EffectComposer } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. 오디오 시스템 (웹 오디오 API 기반)
        // ==========================================
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(actx.state === 'suspended') actx.resume();
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.connect(gain); gain.connect(actx.destination);
            const now = actx.currentTime;
            
            if(type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if(type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1000, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if(type === 'reload') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.5);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if(type === 'empty') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        // ==========================================
        // 2. 무기 데이터베이스 및 전역 상태
        // ==========================================
        const WeaponDB = [
            { id: 0, name: "기본 권총", grade: "normal", color: 0xaaaaaa, damage: 15, fireRate: 300, mag: 12, auto: false, spread: 0.02, recoil: 0.03 },
            { id: 1, name: "기관단총(SMG)", grade: "rare", color: 0x0070dd, damage: 8, fireRate: 90, mag: 30, auto: true, spread: 0.05, recoil: 0.02 },
            { id: 2, name: "전술 샷건", grade: "epic", color: 0xa335ee, damage: 12, fireRate: 800, mag: 6, auto: false, spread: 0.12, recoil: 0.1, pellets: 6 },
            { id: 3, name: "레일건(스나이퍼)", grade: "legendary", color: 0xffd700, damage: 90, fireRate: 1500, mag: 5, auto: false, spread: 0.001, recoil: 0.2 },
            { id: 4, name: "플라즈마 미니건", grade: "legendary", color: 0x00ffff, damage: 12, fireRate: 60, mag: 100, auto: true, spread: 0.08, recoil: 0.015 }
        ];

        window.GameState = {
            username: '', peer: null, conn: null, isHost: false, roomCode: '',
            hp: 100, kills: 0, isDead: false,
            inventory: [WeaponDB[0]], 
            equippedWeaponIndex: 0, ammo: 12, lastShotTime: 0, isReloading: false,
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent) || ('ontouchstart' in window)
        };

        const PEER_PREFIX = 'neonPro-v1-';
        
        let scene, camera, renderer, composer;
        let myGunMesh, gunBarrelEnd;
        const enemies = {}; 
        
        const tracers = []; const particles = []; const damageTexts = [];
        
        // 이동 및 물리 변수
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let joyDir = { x: 0, y: 0 };
        let isPointerLocked = false;
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let lastTime = performance.now();
        
        // 사격 및 조준(ADS) 상태
        let isShootingHeld = false;
        let isAiming = false;

        // 반동 복귀(Lerp)를 위한 변수
        let recoilTarget = new THREE.Vector3(0,0,0);
        let currentRecoil = new THREE.Vector3(0,0,0);

        // ==========================================
        // 3. UI 및 네트워크 바인딩
        // ==========================================
        window.login = () => {
            const name = document.getElementById('username-input').value.trim();
            if(!name) return alert('요원 이름을 입력해야 합니다.');
            window.GameState.username = name;
            
            window.GameState.peer = new Peer({ config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}});
            window.GameState.peer.on('error', (err) => console.log('Peer Error:', err));
            
            document.getElementById('welcome-msg').innerText = `접속 완료: ${name} 요원`;
            document.getElementById('login-ui').classList.add('hidden');
            document.getElementById('lobby-ui').classList.remove('hidden');
        };

        window.showGacha = () => { document.getElementById('lobby-ui').classList.add('hidden'); document.getElementById('gacha-ui').classList.remove('hidden'); };
        window.hideGacha = () => { document.getElementById('gacha-ui').classList.add('hidden'); document.getElementById('lobby-ui').classList.remove('hidden'); };
        
        window.pullGacha = () => {
            const rand = Math.random();
            let wp = (rand < 0.05) ? WeaponDB[3] : (rand < 0.1) ? WeaponDB[4] : (rand < 0.3) ? WeaponDB[2] : (rand < 0.6) ? WeaponDB[1] : WeaponDB[0];
            
            if(!window.GameState.inventory.find(w => w.id === wp.id)) { window.GameState.inventory.push(wp); }
            
            const resEl = document.getElementById('gacha-result');
            resEl.innerText = wp.name; resEl.className = 'grade-' + wp.grade;
            resEl.style.transform = 'scale(1.5)';
            setTimeout(() => resEl.style.transform = 'scale(1)', 150);
        };

        window.showInventory = () => {
            const ui = document.getElementById('inventory-ui');
            ui.innerHTML = '';
            window.GameState.inventory.forEach((wp, index) => {
                const div = document.createElement('div');
                div.className = `inv-item ${index === window.GameState.equippedWeaponIndex ? 'equipped' : ''} grade-${wp.grade}`;
                div.innerText = wp.name;
                div.onclick = () => {
                    window.GameState.equippedWeaponIndex = index;
                    window.GameState.ammo = wp.mag;
                    window.hideInventory();
                    updateHUD();
                    if(scene) buildMyGun();
                };
                ui.appendChild(div);
            });
            document.getElementById('lobby-ui').classList.add('hidden');
            document.getElementById('inventory-ui-panel').classList.remove('hidden');
        };
        window.hideInventory = () => { document.getElementById('inventory-ui-panel').classList.add('hidden'); document.getElementById('lobby-ui').classList.remove('hidden'); };

        function setupNetwork() {
            window.GameState.conn.on('data', (data) => {
                if (data.type === 'start') initGame();
                else if (data.type === 'update') updateEnemyState(data);
                else if (data.type === 'shoot') renderOtherShoot(data);
                else if (data.type === 'hit') handleTakeDamage(data);
                else if (data.type === 'killmsg') handleKillMsg(data);
                else if (data.type === 'respawn') handleEnemyRespawn(data);
            });
        }

        window.createRoom = () => {
            const code = Math.random().toString(36).substring(2, 5).toUpperCase();
            window.GameState.peer.destroy();
            window.GameState.peer = new Peer(PEER_PREFIX + code);
            window.GameState.peer.on('open', () => {
                document.getElementById('room-code-display').innerText = code;
                document.getElementById('lobby-ui').classList.add('hidden');
                document.getElementById('room-ui').classList.remove('hidden');
                window.GameState.isHost = true;
            });
            window.GameState.peer.on('connection', (conn) => {
                window.GameState.conn = conn; setupNetwork();
                document.getElementById('connection-status').innerText = "상대방 접속 완료!";
                document.getElementById('btn-start-game').style.display = 'block';
            });
        };

        window.joinRoom = () => {
            const code = document.getElementById('room-code-input').value.toUpperCase();
            window.GameState.conn = window.GameState.peer.connect(PEER_PREFIX + code);
            window.GameState.conn.on('open', () => {
                setupNetwork();
                document.getElementById('room-code-display').innerText = code;
                document.getElementById('lobby-ui').classList.add('hidden');
                document.getElementById('room-ui').classList.remove('hidden');
                document.getElementById('connection-status').innerText = "방장 연결 완료. 대기중...";
            });
        };

        window.startGame = () => {
            if (window.GameState.conn) window.GameState.conn.send({ type: 'start' });
            initGame();
        };

        // ==========================================
        // 4. Three.js 3D 엔진 초기화
        // ==========================================
        function initGame() {
            if(actx.state === 'suspended') actx.resume();
            
            document.getElementById('room-ui').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            window.GameState.ammo = getCurWeapon().mag;
            updateHUD();

            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030308);
            scene.fog = new THREE.FogExp2(0x030308, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.GameState.isMobile ? 1 : window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.4, 0.85);
            bloomPass.threshold = 0.2; bloomPass.strength = 1.8; bloomPass.radius = 0.5;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene); composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0x333344));
            const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(10, 50, -20); scene.add(dl);
            
            const grid = new THREE.GridHelper(300, 150, 0x00ffff, 0xff00ff); grid.position.y = 0.01; scene.add(grid);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({color: 0x0a0a0a}));
            floor.rotation.x = -Math.PI/2; scene.add(floor);

            const bGeo = new THREE.BoxGeometry(4, 8, 4);
            const bMat = new THREE.MeshPhysicalMaterial({color: 0x111, metalness: 0.9, roughness: 0.1});
            for(let i=0; i<45; i++) {
                const box = new THREE.Mesh(bGeo, bMat);
                box.position.set(Math.random()*160-80, 4, Math.random()*160-80);
                scene.add(box);
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({color: Math.random()>0.5?0x0ff:0xf0f}));
                box.add(edges);
            }

            buildMyGun();
            setupControls();
            respawnPlayer();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });

            lastTime = performance.now();
            animate();
            
            setInterval(() => {
                if(window.GameState.conn && !window.GameState.isDead) {
                    window.GameState.conn.send({ type: 'update', name: window.GameState.username, hp: window.GameState.hp, pos: camera.position, rot: camera.rotation.y });
                }
            }, 50);
        }

        function getCurWeapon() { return window.GameState.inventory[window.GameState.equippedWeaponIndex]; }

        function buildMyGun() {
            if(myGunMesh) camera.remove(myGunMesh);
            myGunMesh = new THREE.Group();
            
            const wp = getCurWeapon();
            const bodyM = new THREE.MeshPhysicalMaterial({color:0x111, metalness:1});
            const neonM = new THREE.MeshStandardMaterial({color:wp.color, emissive:wp.color, emissiveIntensity:5});

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.8, 8), bodyM);
            barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0, -0.4); myGunMesh.add(barrel);
            
            gunBarrelEnd = new THREE.Object3D();
            gunBarrelEnd.position.set(0, 0, -0.8);
            myGunMesh.add(gunBarrelEnd);

            const core = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.4), bodyM);
            core.position.set(0, -0.05, 0.1); myGunMesh.add(core);

            const n1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.3), neonM);
            n1.position.set(0, 0.08, 0.1); myGunMesh.add(n1);

            const light = new THREE.PointLight(wp.color, 1, 3); light.position.set(0,0,-0.2); myGunMesh.add(light);

            myGunMesh.position.set(0.3, -0.3, -0.5);
            camera.add(myGunMesh);
            scene.add(camera);
        }

        function createEnemyModel(id, name) {
            const group = new THREE.Group();
            
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.0, 4, 8), new THREE.MeshStandardMaterial({color:0x333, metalness:0.8}));
            body.position.y = 0.5; group.add(body);
            
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({color:0x555}));
            head.position.y = 1.4; group.add(head);
            
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.3), new THREE.MeshStandardMaterial({color:0xf00, emissive:0xf00, emissiveIntensity:3}));
            visor.position.set(0, 1.4, 0.25); group.add(visor);
            
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
            sprite.position.y = 2.2; sprite.scale.set(1.5, 0.75, 1); group.add(sprite);
            
            enemies[id] = { mesh: group, ctx: ctx, tex: tex, hp: 100, name: name, visor: visor };
            scene.add(group);
            updateEnemyUI(id);
        }

        function updateEnemyUI(id) {
            const e = enemies[id];
            e.ctx.clearRect(0,0,256,128);
            e.ctx.fillStyle = '#fff'; e.ctx.font = 'bold 30px Orbitron'; e.ctx.textAlign = 'center';
            e.ctx.fillText(e.name, 128, 40);
            e.ctx.fillStyle = '#333'; e.ctx.fillRect(28, 60, 200, 20);
            e.ctx.fillStyle = e.hp > 50 ? '#0f0' : e.hp > 20 ? '#ff0' : '#f00';
            e.ctx.fillRect(30, 62, 196 * (e.hp/100), 16);
            e.tex.needsUpdate = true;
        }

        // ==========================================
        // 5. 완벽한 다중 터치 및 입력 시스템
        // ==========================================
        function setupControls() {
            if (window.GameState.isMobile) {
                document.getElementById('mobile-controls').style.display = 'block';
                
                // 조이스틱 다중 터치 방어
                let joyId = null;
                const jz = document.getElementById('joystick-zone'), jk = document.getElementById('joystick-knob');
                
                jz.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(joyId === null) { joyId = t.identifier; updateJoy(t); break; }
                    }
                }, {passive:false});
                
                jz.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(t.identifier === joyId) { updateJoy(t); break; }
                    }
                }, {passive:false});
                
                const endJoy = (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(t.identifier === joyId) { joyId = null; joyDir={x:0,y:0}; jk.style.transform='translate(-50%,-50%)'; break; }
                    }
                };
                jz.addEventListener('touchend', endJoy, {passive:false});
                jz.addEventListener('touchcancel', endJoy, {passive:false});
                
                function updateJoy(t) {
                    const r = jz.getBoundingClientRect();
                    const cx = r.left + r.width/2, cy = r.top + r.height/2;
                    let dx = t.pageX - cx, dy = t.pageY - cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist > 50) { dx = (dx/dist)*50; dy = (dy/dist)*50; }
                    jk.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    joyDir.x = dx/50; joyDir.y = dy/50;
                }

                // 화면 회전 다중 터치 방어
                let lookId = null;
                let lastLookX = 0, lastLookY = 0;
                const lz = document.getElementById('look-zone');
                
                lz.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(lookId === null) {
                            lookId = t.identifier;
                            lastLookX = t.pageX; lastLookY = t.pageY;
                            break;
                        }
                    }
                }, {passive:false});

                lz.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(t.identifier === lookId) {
                            euler.setFromQuaternion(camera.quaternion);
                            euler.y -= (t.pageX - lastLookX) * 0.005;
                            euler.x -= (t.pageY - lastLookY) * 0.005;
                            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
                            camera.quaternion.setFromEuler(euler);
                            lastLookX = t.pageX; lastLookY = t.pageY;
                            break;
                        }
                    }
                }, {passive:false});

                const endLook = (e) => {
                    e.preventDefault();
                    for(let t of e.changedTouches) { if(t.identifier === lookId) { lookId = null; break; } }
                };
                lz.addEventListener('touchend', endLook, {passive:false});
                lz.addEventListener('touchcancel', endLook, {passive:false});

                // 모바일 버튼 바인딩 (다중 터치 겹침 방지)
                function bindBtn(id, onDown, onUp) {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); btn.style.transform='scale(0.9)'; if(onDown) onDown(); }, {passive:false});
                    const end = (e)=>{ e.preventDefault(); btn.style.transform='scale(1)'; if(onUp) onUp(); };
                    btn.addEventListener('touchend', end, {passive:false});
                    btn.addEventListener('touchcancel', end, {passive:false});
                }
                bindBtn('shoot-btn', () => { isShootingHeld = true; tryShoot(); }, () => { isShootingHeld = false; });
                bindBtn('aim-btn', () => { isAiming = !isAiming; });
                bindBtn('jump-btn', doJump);
                bindBtn('reload-btn', doReload);

            } else {
                document.addEventListener('keydown', (e) => {
                    if(e.code==='KeyW') moveF=true; if(e.code==='KeyS') moveB=true;
                    if(e.code==='KeyA') moveL=true; if(e.code==='KeyD') moveR=true;
                    if(e.code==='Space') doJump(); if(e.code==='KeyR') doReload();
                });
                document.addEventListener('keyup', (e) => {
                    if(e.code==='KeyW') moveF=false; if(e.code==='KeyS') moveB=false;
                    if(e.code==='KeyA') moveL=false; if(e.code==='KeyD') moveR=false;
                });
                document.addEventListener('pointerlockchange', () => isPointerLocked = (document.pointerLockElement === document.body));
                
                document.addEventListener('mousedown', (e) => {
                    if(window.GameState.isDead) return;
                    if(!isPointerLocked) { document.body.requestPointerLock().catch(()=>{}); return; }
                    if(e.button === 0) { isShootingHeld = true; tryShoot(); }
                    if(e.button === 2) { isAiming = true; } // 우클릭 정조준
                });
                document.addEventListener('mouseup', (e) => {
                    if(e.button === 0) isShootingHeld = false;
                    if(e.button === 2) isAiming = false;
                });
                document.addEventListener('mousemove', (e) => {
                    if(!isPointerLocked || window.GameState.isDead) return;
                    euler.setFromQuaternion(camera.quaternion);
                    // 줌 상태일 때는 마우스 감도를 낮춤
                    const sensitivity = isAiming ? 0.001 : 0.002;
                    euler.y -= e.movementX * sensitivity; euler.x -= e.movementY * sensitivity;
                    euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                });
            }
        }

        function doJump() { if(canJump && !window.GameState.isDead) { velocity.y = 15; canJump = false; } }
        
        function doReload() {
            if(window.GameState.isReloading || window.GameState.isDead) return;
            const wp = getCurWeapon();
            if(window.GameState.ammo === wp.mag) return;
            
            window.GameState.isReloading = true;
            isAiming = false; // 장전 시 줌 해제
            playSound('reload');
            document.getElementById('hud-ammo').innerText = "R";
            
            // 장전 애니메이션 (아래로 내려감)
            recoilTarget.y = -0.5;
            recoilTarget.x = Math.PI / 4;

            setTimeout(() => {
                window.GameState.ammo = wp.mag;
                window.GameState.isReloading = false;
                recoilTarget.y = 0;
                recoilTarget.x = 0;
                updateHUD();
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('hud-name').innerText = window.GameState.username;
            document.getElementById('hud-hp').innerText = window.GameState.hp;
            document.getElementById('hud-weapon').innerText = getCurWeapon().name;
            document.getElementById('hud-ammo').innerText = window.GameState.ammo;
            document.getElementById('hud-maxammo').innerText = getCurWeapon().mag;
            document.getElementById('hud-kills').innerText = window.GameState.kills;
        }

        // ==========================================
        // 6. 사격 시스템 및 물리 반동(Lerp) 적용
        // ==========================================
        function tryShoot() {
            if(window.GameState.isDead || window.GameState.isReloading) return;
            const now = performance.now();
            const wp = getCurWeapon();
            if (now - window.GameState.lastShotTime < wp.fireRate) return;
            if (window.GameState.ammo <= 0) {
                if(now - window.GameState.lastShotTime > 500) { playSound('empty'); window.GameState.lastShotTime = now; }
                return;
            }

            window.GameState.lastShotTime = now;
            window.GameState.ammo--; updateHUD(); playSound('shoot');

            const pellets = wp.pellets || 1;
            for(let i=0; i<pellets; i++) fireBullet(wp);

            // 반동(Recoil) 목표값 증가 (총기가 뒤로, 위로 밀림)
            recoilTarget.z += wp.recoil * 1.5;
            recoilTarget.x += wp.recoil * 0.8;
            
            // 카메라 화면 킥(Kick)
            euler.setFromQuaternion(camera.quaternion);
            euler.x += wp.recoil * 0.15;
            camera.quaternion.setFromEuler(euler);
        }

        function fireBullet(wp) {
            const rc = new THREE.Raycaster();
            const center = new THREE.Vector2(0,0);
            
            // 정조준(ADS) 시 탄퍼짐 감소
            const spreadMulti = isAiming ? 0.3 : 1.0;
            center.x += (Math.random()-0.5) * wp.spread * spreadMulti;
            center.y += (Math.random()-0.5) * wp.spread * spreadMulti;
            rc.setFromCamera(center, camera);

            let targetPoint; let hitEnemyId = null; let isHeadshot = false;

            const enemyMeshes = [];
            for(let id in enemies) {
                enemyMeshes.push(enemies[id].mesh.children[0]); 
                enemyMeshes.push(enemies[id].mesh.children[1]); 
                enemies[id].mesh.children[0].userData = {id: id, type: 'body'};
                enemies[id].mesh.children[1].userData = {id: id, type: 'head'};
            }

            const allTargets = [...scene.children.filter(c => c.geometry && c.geometry.type === 'BoxGeometry'), ...enemyMeshes];
            const intersects = rc.intersectObjects(allTargets, false);

            if(intersects.length > 0) {
                targetPoint = intersects[0].point;
                const hitObj = intersects[0].object;
                if(hitObj.userData && hitObj.userData.id) {
                    hitEnemyId = hitObj.userData.id;
                    if(hitObj.userData.type === 'head') isHeadshot = true;
                }
            } else {
                targetPoint = rc.ray.direction.clone().multiplyScalar(150).add(camera.position);
            }

            const startPoint = new THREE.Vector3();
            gunBarrelEnd.getWorldPosition(startPoint);

            createTracerLine(startPoint, targetPoint, wp.color);
            createSparks(targetPoint, wp.color);

            if(window.GameState.conn) {
                window.GameState.conn.send({ type: 'shoot', start: startPoint, end: targetPoint, color: wp.color });
                if(hitEnemyId) {
                    let finalDmg = isHeadshot ? wp.damage * 2 : wp.damage;
                    window.GameState.conn.send({ type: 'hit', target: hitEnemyId, damage: finalDmg, isHead: isHeadshot, pos: targetPoint });
                    showHitMarker(isHeadshot); playSound('hit');
                }
            }
        }

        // ==========================================
        // 7. 시각 효과 (Tracer, Sparks, Text)
        // ==========================================
        function createTracerLine(start, end, colorHex) {
            const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3, transparent: true, opacity: 1 });
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), mat);
            scene.add(line); tracers.push({ mesh: line, life: 1.0 });
        }

        function createSparks(pos, colorHex) {
            const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const mat = new THREE.MeshBasicMaterial({color: colorHex});
            for(let i=0; i<3; i++) {
                const mesh = new THREE.Mesh(geo, mat); mesh.position.copy(pos);
                const vel = new THREE.Vector3((Math.random()-0.5)*15, Math.random()*15, (Math.random()-0.5)*15);
                scene.add(mesh); particles.push({ mesh: mesh, vel: vel, life: 1.0 });
            }
        }

        function showHitMarker(isHead) {
            const hm = document.getElementById('hitmarker');
            hm.style.opacity = 1; hm.style.filter = isHead ? 'drop-shadow(0 0 5px red)' : 'drop-shadow(0 0 5px white)';
            setTimeout(() => hm.style.opacity = 0, 150);
        }

        function showDamageText(amount, pos, isHead) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isHead ? '#f00' : '#ff0';
            ctx.font = 'bold 40px Orbitron'; ctx.textAlign = 'center';
            ctx.fillText(isHead ? `!${amount}!` : amount, 64, 45);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.position.copy(pos); sprite.position.y += 0.5;
            scene.add(sprite); damageTexts.push({ sprite: sprite, life: 1.0 });
        }

        // ==========================================
        // 8. 네트워크 리시버 및 데스 매치 로직
        // ==========================================
        function updateEnemyState(data) {
            if(!enemies[data.name]) createEnemyModel(data.name, data.name);
            const e = enemies[data.name];
            e.mesh.position.lerp(new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), 0.3);
            e.mesh.rotation.y = data.rot;
            if(e.hp !== data.hp) { e.hp = data.hp; updateEnemyUI(data.name); }
        }

        function renderOtherShoot(data) {
            createTracerLine(new THREE.Vector3(data.start.x, data.start.y, data.start.z), new THREE.Vector3(data.end.x, data.end.y, data.end.z), data.color);
            playSound('shoot'); 
        }

        function handleTakeDamage(data) {
            if(data.target === window.GameState.username && !window.GameState.isDead) {
                window.GameState.hp -= data.damage; updateHUD();
                const overlay = document.getElementById('damage-overlay');
                overlay.style.opacity = 1; setTimeout(() => overlay.style.opacity = 0, 200);
                
                euler.setFromQuaternion(camera.quaternion);
                euler.x += (Math.random()-0.5)*0.1; euler.y += (Math.random()-0.5)*0.1;
                camera.quaternion.setFromEuler(euler);

                if(window.GameState.hp <= 0) die();
            } else {
                showDamageText(data.damage, new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), data.isHead);
                if(enemies[data.target]) {
                    enemies[data.target].visor.material.emissiveIntensity = 10;
                    setTimeout(() => { if(enemies[data.target]) enemies[data.target].visor.material.emissiveIntensity = 3; }, 100);
                }
            }
        }

        function handleKillMsg(data) {
            const ul = document.getElementById('killfeed');
            const li = document.createElement('li');
            li.innerHTML = `<span style="color:#0ff">${data.killer}</span> 🔫 <span style="color:#f00">${data.victim}</span>`;
            ul.appendChild(li); setTimeout(() => li.remove(), 4000);
            if(data.killer === window.GameState.username) { window.GameState.kills++; updateHUD(); }
        }

        function handleEnemyRespawn(data) {
            if(enemies[data.name]) { enemies[data.name].hp = 100; updateEnemyUI(data.name); }
        }

        function die() {
            window.GameState.isDead = true; window.GameState.hp = 0; updateHUD();
            window.GameState.conn.send({ type: 'killmsg', killer: "Enemy", victim: window.GameState.username });
            handleKillMsg({killer: "Enemy", victim: window.GameState.username});

            document.getElementById('respawn-ui').classList.remove('hidden');
            if(isPointerLocked) document.exitPointerLock();

            camera.position.y = 0.2; camera.rotation.z = Math.PI / 4;
            isAiming = false; // 사망 시 줌 해제

            let timeLeft = 3;
            const timerEl = document.getElementById('respawn-timer');
            const interval = setInterval(() => {
                timeLeft--; timerEl.innerText = `${timeLeft}초 후 부활...`;
                if(timeLeft <= 0) { clearInterval(interval); respawnPlayer(); }
            }, 1000);
        }

        function respawnPlayer() {
            window.GameState.isDead = false; window.GameState.hp = 100; window.GameState.ammo = getCurWeapon().mag;
            updateHUD();
            camera.position.set(Math.random()*120-60, 1.7, Math.random()*120-60);
            camera.rotation.set(0,0,0);
            document.getElementById('respawn-ui').classList.add('hidden');
            window.GameState.conn.send({ type: 'respawn', name: window.GameState.username });
        }

        // ==========================================
        // 9. 메인 렌더링 물리(Lerp) 루프
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            if (!window.GameState.isDead) {
                if(isShootingHeld && getCurWeapon().auto) tryShoot();

                // 이동 마찰 및 물리
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; 

                direction.x = (Number(moveR) - Number(moveL)) + joyDir.x;
                direction.z = (Number(moveB) - Number(moveF)) + joyDir.y;
                if(direction.length() > 1.0) direction.normalize();

                const speed = 400.0;
                velocity.x -= direction.x * speed * delta;
                velocity.z -= direction.z * speed * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                if (camera.position.y < 1.7) { velocity.y = 0; camera.position.y = 1.7; canJump = true; }
                if (camera.position.x > 145) camera.position.x = 145; if (camera.position.x < -145) camera.position.x = -145;
                if (camera.position.z > 145) camera.position.z = 145; if (camera.position.z < -145) camera.position.z = -145;

                // 정조준(ADS) 카메라 줌 처리 (FOV 보간)
                const targetFov = isAiming ? 45 : 75;
                camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 10 * delta);
                camera.updateProjectionMatrix();

                // 반동 목표치로 부드럽게 이동 후 서서히 복귀 (Lerp)
                currentRecoil.lerp(recoilTarget, 15 * delta);
                recoilTarget.lerp(new THREE.Vector3(0,0,0), 10 * delta);

                if(myGunMesh && !window.GameState.isReloading) {
                    // 줌 상태에 따라 총기 위치 화면 중앙으로 정렬
                    const targetX = isAiming ? 0 : 0.3;
                    const targetY = isAiming ? -0.2 : -0.3;
                    
                    myGunMesh.position.x = THREE.MathUtils.lerp(myGunMesh.position.x, targetX, 15 * delta);
                    
                    // 총기 호흡(Sway) 및 반동 적용
                    let swayY = 0;
                    if(velocity.x > 1 || velocity.z > 1) swayY = Math.sin(time*0.015)*0.015; // 달릴 때
                    else swayY = Math.sin(time*0.003)*0.005; // 대기 중
                    
                    myGunMesh.position.y = targetY + swayY + currentRecoil.y;
                    myGunMesh.position.z = -0.5 + currentRecoil.z;
                    myGunMesh.rotation.x = currentRecoil.x;
                }
            }

            for(let i = tracers.length-1; i>=0; i--) {
                tracers[i].life -= delta * 5;
                if(tracers[i].life <= 0) { scene.remove(tracers[i].mesh); tracers.splice(i, 1); } 
                else tracers[i].mesh.material.opacity = tracers[i].life;
            }
            for(let i = particles.length-1; i>=0; i--) {
                const p = particles[i]; p.vel.y -= 20 * delta;
                p.mesh.position.addScaledVector(p.vel, delta); p.life -= delta * 2;
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            for(let i = damageTexts.length-1; i>=0; i--) {
                const dt = damageTexts[i]; dt.sprite.position.y += delta; dt.life -= delta * 1.5;
                if(dt.life <= 0) { scene.remove(dt.sprite); damageTexts.splice(i, 1); }
                else dt.sprite.material.opacity = dt.life;
            }

            if(composer) composer.render();
        }
    </script>
</body>
</html>
