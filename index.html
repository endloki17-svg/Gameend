<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RIVALS CLONE - V5 ENGINE SYNC</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Teko:wght@600&display=swap');
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background-color: #1a1a24; font-family: 'Noto Sans KR', sans-serif; color: #fff; 
            user-select: none; touch-action: none; -webkit-touch-callout: none;
        }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 공통 UI 패널 */
        .ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(8px); transition: 0.3s;
        }
        .hidden { display: none !important; }
        
        .panel { 
            background: #2b2b36; border-radius: 12px; padding: 30px; text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #3e3e4f;
            width: 85%; max-width: 450px; max-height: 90vh; overflow-y: auto;
        }
        
        h1 { font-family: 'Teko', sans-serif; font-size: 4rem; margin: 0 0 10px 0; color: #ff3366; letter-spacing: 2px; text-shadow: 2px 2px 0px #000; }
        h2 { font-size: 1.5rem; color: #fff; margin-bottom: 20px; }
        
        input { 
            width: 85%; padding: 15px; margin: 10px 0; background: #1a1a24; border: 2px solid #444; 
            border-radius: 8px; color: #fff; font-size: 1.2rem; text-align: center; outline: none; font-weight: bold; transition: 0.2s;
        }
        input:focus { border-color: #ff3366; box-shadow: 0 0 10px rgba(255,51,102,0.3); }
        
        button { 
            width: 90%; padding: 15px; margin: 8px 0; background: #fff; border: none; border-radius: 8px; 
            color: #111; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 4px 0px #ccc;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0px 0px #ccc; }
        
        .btn-primary { background: #ff3366; color: #fff; box-shadow: 0 4px 0px #cc0033; }
        .btn-key { background: #ffd700; color: #000; box-shadow: 0 4px 0px #ccaa00; font-family: 'Teko', sans-serif; font-size: 1.5rem; }

        /* 상단 상태 표시줄 (열쇠, 킬) */
        .top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 30px; border-radius: 20px;
            display: flex; gap: 20px; font-size: 1.2rem; font-weight: bold; z-index: 25;
        }
        .key-icon { color: #ffd700; text-shadow: 0 0 5px #ffd700; }

        /* 인게임 HUD */
        #crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        .ch-line { position: absolute; background: #fff; box-shadow: 0 0 2px #000; transition: 0.1s ease-out; }
        #ch-top { width: 2px; height: 10px; left: -1px; top: -15px; }
        #ch-bottom { width: 2px; height: 10px; left: -1px; top: 5px; }
        #ch-left { width: 10px; height: 2px; top: -1px; left: -15px; }
        #ch-right { width: 10px; height: 2px; top: -1px; left: 5px; }
        
        #hitmarker { 
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); 
            z-index: 6; opacity: 0; transition: opacity 0.1s; pointer-events: none;
            background-image: linear-gradient(45deg, transparent 40%, #fff 40%, #fff 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, #fff 40%, #fff 60%, transparent 60%);
        }

        #hud-hp-bar { position: absolute; bottom: 30px; left: 30px; width: 200px; height: 20px; background: #333; z-index: 10; border: 2px solid #222; border-radius: 4px; }
        #hud-hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s, background 0.2s; }
        #hud-hp-text { position: absolute; top: -25px; left: 0; font-size: 1.2rem; font-weight: 900; text-shadow: 2px 2px 0 #000; }
        
        #dash-bar { position: absolute; bottom: 15px; left: 30px; width: 150px; height: 6px; background: #333; z-index: 10; border: 2px solid #222; overflow: hidden; border-radius: 4px; }
        #dash-fill { width: 100%; height: 100%; background: #00ffff; transition: width 0.1s; }

        #hud-ammo { position: absolute; bottom: 20px; right: 30px; font-family: 'Teko', sans-serif; font-size: 4.5rem; line-height: 1; text-shadow: 3px 3px 0 #000; z-index: 10; font-weight: bold; }
        #hud-weapon { position: absolute; bottom: 85px; right: 35px; font-size: 1.2rem; font-weight: 900; color: #ccc; text-shadow: 1px 1px 0 #000; text-transform: uppercase; }

        #hud-top-right { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; min-width: 150px; text-align: right; }
        #killfeed { list-style: none; padding: 0; margin: 0 0 10px 0; font-weight: bold; font-size: 0.9rem; text-shadow: 1px 1px 0 #000; }

        /* 상점 리스트 */
        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .store-item { background: #1a1a24; border: 2px solid #444; padding: 15px 5px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .store-item:hover { border-color: #fff; }
        .store-item.locked { opacity: 0.7; }
        .store-item.equipped { border-color: #ff3366; background: rgba(255,51,102,0.2); }
        .price-tag { color: #ffd700; margin-top: 5px; font-family: 'Teko', sans-serif; font-size: 1.2rem; }

        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.5) 100%); z-index: 2; opacity: 0; pointer-events: none; transition: 0.2s; }

        /* 모바일 터치 컨트롤러 */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; display: none; }
        .touch-btn { position: absolute; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; color: #fff; backdrop-filter: blur(2px); user-select: none; transition: transform 0.1s; }
        
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 14; }
        
        .action-btns { z-index: 16; }
        #shoot-btn { bottom: 40px; right: 40px; width: 90px; height: 90px; background: rgba(255,51,102,0.3); border-color: #ff3366; }
        #dash-btn { bottom: 150px; right: 40px; width: 65px; height: 65px; font-size: 0.8rem; }
        #jump-btn { bottom: 40px; right: 150px; width: 65px; height: 65px; font-size: 0.8rem; }
        #reload-btn { bottom: 130px; right: 130px; width: 50px; height: 50px; font-size: 0.7rem; }
        #swap-btn { bottom: 230px; right: 40px; width: 50px; height: 50px; font-size: 0.7rem; }
        
        #engine-loading { position: absolute; top: 10px; right: 10px; color: #ff3366; font-weight: bold; font-size: 0.9rem; z-index: 100; text-shadow: 1px 1px 0 #000; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="engine-loading">3D 엔진 모듈 준비 중...</div>

    <!-- 상태 표시줄 -->
    <div class="top-bar hidden" id="top-bar">
        <div><span class="key-icon">🗝️</span> 열쇠: <span id="ui-keys">0</span></div>
        <div>💀 킬: <span id="ui-kills">0</span></div>
    </div>

    <!-- UI: 로그인 -->
    <div id="login-ui" class="ui-layer">
        <div class="panel">
            <h1>RIVALS CLONE</h1>
            <p style="color: #aaa; margin-bottom: 20px;">[ 엔진 모듈 분리 버전 ]</p>
            <input type="text" id="username-input" placeholder="요원 닉네임 입력" maxlength="8">
            <button class="btn-primary" onclick="window.ui_login()">게임 접속하기</button>
        </div>
    </div>

    <!-- UI: 로비 -->
    <div id="lobby-ui" class="ui-layer hidden">
        <div class="panel">
            <h2>메인 로비</h2>
            <button class="btn-key" onclick="window.ui_showStore()">🛒 무기 상점 및 장비창</button>
            <hr style="border-color: #444; margin: 20px 0;">
            <button onclick="window.ui_createRoom()">⚔️ 새로운 매치 방 만들기</button>
            <p style="margin: 10px 0; color:#888;">또는</p>
            <input type="text" id="room-code-input" placeholder="방 코드 (3자리)" maxlength="3" style="text-transform: uppercase;">
            <button onclick="window.ui_joinRoom()">참가하기</button>
        </div>
    </div>

    <!-- UI: 상점 -->
    <div id="store-ui" class="ui-layer hidden">
        <div class="panel" style="max-width: 600px;">
            <h2 style="margin-bottom: 5px;">무기 상점</h2>
            <p style="color:#aaa; font-size:0.9rem; margin-top:0;">상대를 쓰러뜨려 획득한 열쇠로 해금하세요.</p>
            <div id="store-grid" class="store-grid"></div>
            <button onclick="window.ui_hideStore()" style="margin-top: 20px; background:#444; color:#fff;">로비로 돌아가기</button>
        </div>
    </div>

    <!-- UI: 대기실 -->
    <div id="room-ui" class="ui-layer hidden">
        <div class="panel">
            <h2>매칭 대기실</h2>
            <p style="color: #aaa;">친구에게 아래 코드를 전달하세요.</p>
            <div id="room-code-display" style="font-family:'Teko'; font-size: 4.5rem; color: #ff3366; letter-spacing: 10px; margin: 10px 0;">---</div>
            <p id="connection-status" style="color: #ffd700;">상대방을 기다리는 중...</p>
            <button id="btn-start-game" class="btn-primary" onclick="window.ui_startGame()" style="display: none; margin-top: 20px;">결투 시작</button>
        </div>
    </div>

    <!-- UI: 사망 및 리스폰 -->
    <div id="respawn-ui" class="ui-layer hidden" style="background: rgba(255,0,0,0.85);">
        <h1 style="color: #fff; font-size: 5rem; text-shadow: none;">WASTED</h1>
        <p id="respawn-timer" style="font-size: 2rem; font-weight: bold; color:#fff;">3초 후 부활...</p>
    </div>

    <!-- 인게임 HUD -->
    <div id="game-ui" class="hidden">
        <div id="damage-overlay"></div>
        <div id="crosshair-container">
            <div class="ch-line" id="ch-top"></div><div class="ch-line" id="ch-bottom"></div>
            <div class="ch-line" id="ch-left"></div><div class="ch-line" id="ch-right"></div>
        </div>
        <div id="hitmarker"></div>
        
        <div id="hud-hp-bar">
            <div id="hud-hp-text">HP <span id="hp-val">100</span></div>
            <div id="hud-hp-fill"></div>
        </div>
        <div id="dash-bar"><div id="dash-fill"></div></div>
        
        <div id="hud-weapon">PISTOL</div>
        <div id="hud-ammo">12</div>
        
        <div id="hud-top-right">
            <ul id="killfeed"></ul>
            <div style="border-top: 1px solid #444; padding-top: 5px;">Kills: <span id="hud-kills" style="color:#ff3366;">0</span></div>
        </div>
        
        <div id="mobile-controls">
            <div id="look-zone"></div>
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div id="shoot-btn" class="touch-btn action-btns">FIRE</div>
            <div id="dash-btn" class="touch-btn action-btns">DASH</div>
            <div id="jump-btn" class="touch-btn action-btns">JUMP</div>
            <div id="reload-btn" class="touch-btn action-btns">R</div>
            <div id="swap-btn" class="touch-btn action-btns">SWAP</div>
        </div>
    </div>
    
    <div id="game-container"></div>

    <!-- 메인 게임 로직 (모듈 임포트 및 시스템 제어) -->
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.158.0';
        import { Engine, startEngine, buildWeaponModel, createEnemyModel, updateEnemyUI, applyPhysicsAndCollision } from './engine.js';

        document.getElementById('engine-loading').style.display = 'none';

        // ==========================================
        // 1. 오디오 처리
        // ==========================================
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(actx.state === 'suspended') actx.resume();
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.connect(gain); gain.connect(actx.destination);
            const now = actx.currentTime;
            
            if(type === 'shoot') {
                osc.type = 'square'; osc.frequency.setValueAtTime(350, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if(type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if(type === 'dash') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if(type === 'heal') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // ==========================================
        // 2. 게임 데이터베이스 및 상태 (GameState)
        // ==========================================
        const WeaponDB = [
            { id: 0, type: 'ranged', name: "전술 권총", cost: 0, damage: 15, fireRate: 250, mag: 12, auto: false, recoil: 0.03, spread: 0.015, range: 100 },
            { id: 1, type: 'ranged', name: "매그넘 리볼버", cost: 3, damage: 45, fireRate: 600, mag: 6, auto: false, recoil: 0.1, spread: 0.005, range: 150 },
            { id: 2, type: 'ranged', name: "돌격 소총", cost: 7, damage: 12, fireRate: 100, mag: 30, auto: true, recoil: 0.02, spread: 0.02, range: 120 },
            { id: 3, type: 'melee', name: "카타나", cost: 10, damage: 55, fireRate: 500, mag: 999, auto: true, recoil: 0, spread: 0, range: 4.5 },
            { id: 4, type: 'heal', name: "메디킷", cost: 15, damage: -50, fireRate: 1500, mag: 999, auto: false, recoil: 0, spread: 0, range: 0 }
        ];

        const GameState = {
            username: '', peer: null, conn: null, isHost: false,
            hp: 100, keys: 0, kills: 0, isDead: false,
            unlockedWeapons: [0], equippedWeaponIndex: 0, ammo: 12, lastShotTime: 0, isReloading: false,
            dashCooldown: 0,
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent) || ('ontouchstart' in window)
        };

        const velocity = new THREE.Vector3(); const direction = new THREE.Vector3();
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let joyDir = { x: 0, y: 0 };
        let isPointerLocked = false;
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let lastTime = performance.now();
        
        let isShootingHeld = false;
        let recoilTarget = new THREE.Vector3(); let currentRecoil = new THREE.Vector3();

        function getCurWeapon() { return WeaponDB[GameState.equippedWeaponIndex]; }

        // ==========================================
        // 3. UI 글로벌 바인딩 (window)
        // ==========================================
        window.ui_login = () => {
            const name = document.getElementById('username-input').value.trim();
            if(!name) return alert('이름을 입력하세요.');
            GameState.username = name;
            
            try { GameState.peer = new Peer(); } 
            catch(e) { console.error(e); alert("네트워크 초기화 오류"); }
            
            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('login-ui').classList.add('hidden');
            document.getElementById('lobby-ui').classList.remove('hidden');
        };

        function renderStoreUI() {
            const grid = document.getElementById('store-grid');
            if(!grid) return;
            grid.innerHTML = '';
            WeaponDB.forEach((wp, idx) => {
                const isUnlocked = GameState.unlockedWeapons.includes(wp.id);
                const isEquipped = GameState.equippedWeaponIndex === idx;
                const div = document.createElement('div');
                div.className = `store-item ${!isUnlocked ? 'locked' : ''} ${isEquipped ? 'equipped' : ''}`;
                
                let statusText = isEquipped ? "장착됨" : (isUnlocked ? "장착하기" : `구매하기`);
                div.innerHTML = `
                    <div style="font-size:1.2rem; color:#fff">${wp.name}</div>
                    <div style="font-size:0.8rem; color:#888;">${wp.type==='heal'?'치료':(wp.type==='melee'?'근접':'사격')}</div>
                    ${!isUnlocked ? `<div class="price-tag">🗝️ ${wp.cost}</div>` : ''}
                    <div style="margin-top:10px; font-size:0.9rem;">[ ${statusText} ]</div>
                `;
                
                div.onclick = () => {
                    if(isUnlocked) {
                        GameState.equippedWeaponIndex = idx;
                        GameState.ammo = wp.mag;
                        renderStoreUI(); updateHUD();
                        if(Engine.scene) buildWeaponModel(wp.id, Engine.camera);
                    } else {
                        if(GameState.keys >= wp.cost) {
                            GameState.keys -= wp.cost;
                            GameState.unlockedWeapons.push(wp.id);
                            document.getElementById('ui-keys').innerText = GameState.keys;
                            renderStoreUI();
                        } else { alert('열쇠가 부족합니다!'); }
                    }
                };
                grid.appendChild(div);
            });
        }

        window.ui_showStore = () => { renderStoreUI(); document.getElementById('lobby-ui').classList.add('hidden'); document.getElementById('store-ui').classList.remove('hidden'); };
        window.ui_hideStore = () => { document.getElementById('store-ui').classList.add('hidden'); document.getElementById('lobby-ui').classList.remove('hidden'); };

        function setupNetworkEvents() {
            GameState.conn.on('data', (data) => {
                if (data.type === 'start') launchGame();
                else if (data.type === 'update') updateRemotePlayer(data);
                else if (data.type === 'shoot') renderOtherShoot(data);
                else if (data.type === 'hit') handleTakeDamage(data);
                else if (data.type === 'killmsg') handleKillMsg(data);
                else if (data.type === 'respawn') handleEnemyRespawn(data);
            });
        }

        window.ui_createRoom = () => {
            if(!GameState.peer) return alert("통신 모듈 대기중");
            const code = Math.random().toString(36).substring(2, 5).toUpperCase();
            GameState.peer.destroy(); GameState.peer = new Peer('rvls-' + code);
            
            GameState.peer.on('open', () => {
                document.getElementById('room-code-display').innerText = code;
                document.getElementById('lobby-ui').classList.add('hidden');
                document.getElementById('room-ui').classList.remove('hidden');
                GameState.isHost = true;
            });
            GameState.peer.on('connection', (conn) => {
                GameState.conn = conn; setupNetworkEvents();
                document.getElementById('connection-status').innerText = "상대방 접속 완료!";
                document.getElementById('connection-status').style.color = "#0f0";
                document.getElementById('btn-start-game').style.display = 'block';
            });
        };

        window.ui_joinRoom = () => {
            if(!GameState.peer) return;
            const code = document.getElementById('room-code-input').value.toUpperCase();
            if(!code) return;
            GameState.conn = GameState.peer.connect('rvls-' + code);
            GameState.conn.on('open', () => {
                setupNetworkEvents();
                document.getElementById('room-code-display').innerText = code;
                document.getElementById('lobby-ui').classList.add('hidden');
                document.getElementById('room-ui').classList.remove('hidden');
                document.getElementById('connection-status').innerText = "방장 연결 완료. 대기중...";
                document.getElementById('connection-status').style.color = "#0f0";
            });
            GameState.conn.on('error', () => alert("방 코드를 확인해주세요."));
        };

        window.ui_startGame = () => {
            if (GameState.conn) GameState.conn.send({ type: 'start' });
            launchGame();
        };

        // ==========================================
        // 4. 게임 통합 시동 함수
        // ==========================================
        function launchGame() {
            if(actx.state === 'suspended') actx.resume();
            document.getElementById('room-ui').classList.add('hidden');
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            GameState.ammo = getCurWeapon().mag;
            updateHUD();

            // engine.js의 그래픽 엔진 초기화 호출
            startEngine(document.getElementById('game-container'), GameState.isMobile);
            
            // 무기 초기화 및 컨트롤 셋업
            buildWeaponModel(getCurWeapon().id, Engine.camera);
            setupControls();
            respawnPlayer();

            window.addEventListener('resize', () => {
                Engine.camera.aspect = window.innerWidth / window.innerHeight;
                Engine.camera.updateProjectionMatrix();
                Engine.renderer.setSize(window.innerWidth, window.innerHeight);
                Engine.composer.setSize(window.innerWidth, window.innerHeight);
            });

            lastTime = performance.now();
            animate();
            
            // 네트워크 전송 루프
            setInterval(() => {
                if(GameState.conn && !GameState.isDead) {
                    GameState.conn.send({ type: 'update', name: GameState.username, hp: GameState.hp, pos: Engine.camera.position, rot: Engine.camera.rotation.y });
                }
            }, 50);
        }

        // ==========================================
        // 5. 컨트롤, 사격, 액션 스킬
        // ==========================================
        function setupControls() {
            if (GameState.isMobile) {
                document.getElementById('mobile-controls').style.display = 'block';
                
                let joyId = null; const jz = document.getElementById('joystick-zone'), jk = document.getElementById('joystick-knob');
                jz.addEventListener('touchstart', (e) => { e.preventDefault(); for(let t of e.changedTouches) { if(joyId === null) { joyId = t.identifier; updateJoy(t); break; } } }, {passive:false});
                jz.addEventListener('touchmove', (e) => { e.preventDefault(); for(let t of e.changedTouches) { if(t.identifier === joyId) { updateJoy(t); break; } } }, {passive:false});
                const endJoy = (e) => { e.preventDefault(); for(let t of e.changedTouches) { if(t.identifier === joyId) { joyId = null; joyDir={x:0,y:0}; jk.style.transform='translate(-50%,-50%)'; break; } } };
                jz.addEventListener('touchend', endJoy, {passive:false}); jz.addEventListener('touchcancel', endJoy, {passive:false});
                function updateJoy(t) {
                    const r = jz.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2;
                    let dx = t.clientX - cx, dy = t.clientY - cy; const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
                    jk.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    joyDir.x = dx/40; joyDir.y = dy/40;
                }

                let lookId = null; let lastLookX = 0, lastLookY = 0;
                const lz = document.getElementById('look-zone');
                lz.addEventListener('touchstart', (e) => { e.preventDefault(); for(let t of e.changedTouches) { if(lookId === null) { lookId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; break; } } }, {passive:false});
                lz.addEventListener('touchmove', (e) => { e.preventDefault();
                    for(let t of e.changedTouches) {
                        if(t.identifier === lookId) {
                            euler.setFromQuaternion(Engine.camera.quaternion);
                            euler.y -= (t.clientX - lastLookX) * 0.005; euler.x -= (t.clientY - lastLookY) * 0.005;
                            euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                            Engine.camera.quaternion.setFromEuler(euler);
                            lastLookX = t.clientX; lastLookY = t.clientY; break;
                        }
                    }
                }, {passive:false});
                const endLook = (e) => { e.preventDefault(); for(let t of e.changedTouches) { if(t.identifier === lookId) { lookId = null; break; } } };
                lz.addEventListener('touchend', endLook, {passive:false}); lz.addEventListener('touchcancel', endLook, {passive:false});

                function bindBtn(id, onDown, onUp) {
                    const btn = document.getElementById(id); if(!btn) return;
                    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); btn.style.transform='scale(0.9)'; if(onDown) onDown(); }, {passive:false});
                    const end = (e)=>{ e.preventDefault(); e.stopPropagation(); btn.style.transform='scale(1)'; if(onUp) onUp(); };
                    btn.addEventListener('touchend', end, {passive:false}); btn.addEventListener('touchcancel', end, {passive:false});
                }
                bindBtn('shoot-btn', () => { isShootingHeld = true; tryAction(); }, () => { isShootingHeld = false; });
                bindBtn('jump-btn', doJump); bindBtn('dash-btn', doDash); bindBtn('reload-btn', doReload); bindBtn('swap-btn', swapWeapon);

            } else {
                document.addEventListener('keydown', (e) => {
                    if(e.code==='KeyW') moveF=true; if(e.code==='KeyS') moveB=true;
                    if(e.code==='KeyA') moveL=true; if(e.code==='KeyD') moveR=true;
                    if(e.code==='Space') doJump(); if(e.code==='KeyR') doReload();
                    if(e.code==='KeyQ' || e.code==='ShiftLeft') doDash();
                    if(e.code==='KeyE') swapWeapon();
                });
                document.addEventListener('keyup', (e) => {
                    if(e.code==='KeyW') moveF=false; if(e.code==='KeyS') moveB=false;
                    if(e.code==='KeyA') moveL=false; if(e.code==='KeyD') moveR=false;
                });
                document.addEventListener('pointerlockchange', () => isPointerLocked = (document.pointerLockElement === document.body));
                
                document.addEventListener('mousedown', (e) => {
                    if(GameState.isDead) return;
                    if(!isPointerLocked) { document.body.requestPointerLock().catch(()=>{}); return; }
                    if(e.button === 0) { isShootingHeld = true; tryAction(); }
                });
                document.addEventListener('mouseup', (e) => { if(e.button === 0) isShootingHeld = false; });
                document.addEventListener('mousemove', (e) => {
                    if(!isPointerLocked || GameState.isDead) return;
                    euler.setFromQuaternion(Engine.camera.quaternion);
                    euler.y -= e.movementX * 0.002; euler.x -= e.movementY * 0.002;
                    euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                    Engine.camera.quaternion.setFromEuler(euler);
                });
            }
        }

        function updateHUD() {
            try {
                const elHpVal = document.getElementById('hp-val'); if(elHpVal) elHpVal.innerText = Math.floor(GameState.hp);
                const elHpFill = document.getElementById('hud-hp-fill');
                if(elHpFill) { elHpFill.style.width = `${GameState.hp}%`; elHpFill.style.background = GameState.hp > 50 ? '#0f0' : GameState.hp > 20 ? '#ff0' : '#f00'; }
                
                const wp = getCurWeapon();
                const elWeapon = document.getElementById('hud-weapon'); if(elWeapon) elWeapon.innerText = wp.name;
                const elAmmo = document.getElementById('hud-ammo'); if(elAmmo) elAmmo.innerText = (wp.type==='melee' || wp.type==='heal') ? "∞" : GameState.ammo;
                const elKills = document.getElementById('hud-kills'); if(elKills) elKills.innerText = GameState.kills;
            } catch(e) { console.warn("HUD 업뎃 무시됨", e); }
        }

        function doJump() { if(canJump && !GameState.isDead) { velocity.y = 15; canJump = false; } }
        
        function doDash() {
            if(GameState.dashCooldown > 0 || GameState.isDead) return;
            playSound('dash');
            let dashDir = new THREE.Vector3();
            if(moveF || moveB || moveL || moveR || joyDir.x !== 0 || joyDir.y !== 0) {
                dashDir.x = (Number(moveR) - Number(moveL)) + joyDir.x;
                dashDir.z = (Number(moveB) - Number(moveF)) + joyDir.y;
                dashDir.normalize(); dashDir.applyEuler(new THREE.Euler(0, Engine.camera.rotation.y, 0));
            } else {
                Engine.camera.getWorldDirection(dashDir); dashDir.y = 0; dashDir.normalize();
            }
            velocity.x += dashDir.x * 80; velocity.z += dashDir.z * 80; // 빠르고 강력한 대시
            GameState.dashCooldown = 2.0; // 라이벌 스타일의 빠른 쿨타임
            Engine.camera.fov = 95; Engine.camera.updateProjectionMatrix();
            setTimeout(()=> { Engine.camera.fov = 80; Engine.camera.updateProjectionMatrix(); }, 200);
        }

        function doReload() {
            if(GameState.isReloading || GameState.isDead) return;
            const wp = getCurWeapon(); if(wp.type === 'melee' || wp.type === 'heal' || GameState.ammo === wp.mag) return;
            GameState.isReloading = true; playSound('reload'); 
            const ammoEl = document.getElementById('hud-ammo'); if(ammoEl) ammoEl.innerText = "R";
            recoilTarget.y = -0.5; recoilTarget.x = Math.PI / 4;
            setTimeout(() => { GameState.ammo = wp.mag; GameState.isReloading = false; recoilTarget.set(0,0,0); updateHUD(); }, 1000);
        }

        function swapWeapon() {
            if(GameState.unlockedWeapons.length <= 1 || GameState.isDead) return;
            let currentInvIdx = GameState.unlockedWeapons.indexOf(getCurWeapon().id);
            currentInvIdx = (currentInvIdx + 1) % GameState.unlockedWeapons.length;
            GameState.equippedWeaponIndex = WeaponDB.findIndex(w => w.id === GameState.unlockedWeapons[currentInvIdx]);
            GameState.ammo = getCurWeapon().mag; GameState.isReloading = false;
            buildWeaponModel(getCurWeapon().id, Engine.camera); updateHUD();
        }

        function tryAction() {
            if(GameState.isDead || GameState.isReloading) return;
            const now = performance.now(); const wp = getCurWeapon();
            if (now - GameState.lastShotTime < wp.fireRate) return;
            
            if(wp.type === 'ranged') {
                if (GameState.ammo <= 0) { if(now - GameState.lastShotTime > 500) { playSound('empty'); GameState.lastShotTime = now; } return; }
                GameState.ammo--; updateHUD(); playSound('shoot');
                processHitscan(wp);
                
                // 크로스헤어 애니메이션 및 반동
                updateCrosshair(15);
                recoilTarget.z += wp.recoil * 1.5; recoilTarget.x += wp.recoil * 0.8;
                euler.setFromQuaternion(Engine.camera.quaternion); euler.x += wp.recoil * 0.15; Engine.camera.quaternion.setFromEuler(euler);
            } else if(wp.type === 'melee') {
                playSound('shoot'); 
                recoilTarget.x = -Math.PI/3; recoilTarget.y = -0.3; setTimeout(()=> { recoilTarget.set(0,0,0); }, 150);
                processMelee(wp);
            } else if(wp.type === 'heal') {
                playSound('heal'); GameState.hp += 50; if(GameState.hp > 100) GameState.hp = 100;
                updateHUD();
                recoilTarget.z = -0.2; recoilTarget.x = Math.PI/4; setTimeout(()=> { recoilTarget.set(0,0,0); }, 300);
            }
            GameState.lastShotTime = now;
        }

        function processHitscan(wp) {
            const rc = new THREE.Raycaster(); const center = new THREE.Vector2(0,0);
            center.x += (Math.random()-0.5) * wp.spread; center.y += (Math.random()-0.5) * wp.spread;
            rc.setFromCamera(center, Engine.camera);

            let targetPoint; let hitEnemyId = null; let isHeadshot = false;

            // 적 Bounding Box 판정
            const enemyMeshes = [];
            for(let id in Engine.enemies) {
                const eGrp = Engine.enemies[id].mesh;
                if(eGrp.children.length > 2) {
                    enemyMeshes.push(eGrp.children[0]); // Head
                    enemyMeshes.push(eGrp.children[2]); // Torso
                    eGrp.children[0].userData = {id: id, type: 'head'};
                    eGrp.children[2].userData = {id: id, type: 'body'};
                }
            }
            // 맵 장애물 + 적
            const allTargets = [...Engine.collidables.map(c=>c.mesh), ...enemyMeshes];
            const intersects = rc.intersectObjects(allTargets, false);

            if(intersects.length > 0) {
                targetPoint = intersects[0].point; const hitObj = intersects[0].object;
                if(hitObj.userData && hitObj.userData.id) {
                    hitEnemyId = hitObj.userData.id;
                    if(hitObj.userData.type === 'head') isHeadshot = true;
                }
            } else { targetPoint = rc.ray.direction.clone().multiplyScalar(100).add(Engine.camera.position); }

            const startPoint = new THREE.Vector3(); Engine.gunBarrelEnd.getWorldPosition(startPoint);
            createTracerLine(startPoint, targetPoint, 0xffffff);

            if(GameState.conn) {
                GameState.conn.send({ type: 'shoot', start: startPoint, end: targetPoint, color: 0xffffff });
                if(hitEnemyId) {
                    let finalDmg = isHeadshot ? wp.damage * 2 : wp.damage;
                    GameState.conn.send({ type: 'hit', target: hitEnemyId, damage: finalDmg, isHead: isHeadshot });
                    showHitMarker(isHeadshot); playSound('hit');
                }
            }
        }

        function processMelee(wp) {
            const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(0,0), Engine.camera);
            const enemyMeshes = [];
            for(let id in Engine.enemies) { enemyMeshes.push(Engine.enemies[id].mesh.children[2]); Engine.enemies[id].mesh.children[2].userData = {id: id}; }
            const intersects = rc.intersectObjects(enemyMeshes, false);
            
            if(intersects.length > 0 && intersects[0].distance <= wp.range) {
                const hitObj = intersects[0].object;
                if(hitObj.userData && hitObj.userData.id) {
                    GameState.conn.send({ type: 'hit', target: hitObj.userData.id, damage: wp.damage, isHead: false });
                    showHitMarker(false); playSound('hit');
                }
            }
        }

        function createTracerLine(start, end, colorHex) {
            const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 1 });
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), mat);
            Engine.scene.add(line); Engine.tracers.push({ mesh: line, life: 0.5 }); 
        }

        function showHitMarker(isHead) {
            const hm = document.getElementById('hitmarker'); if(!hm) return;
            hm.style.opacity = 1; hm.style.filter = isHead ? 'drop-shadow(0 0 5px red)' : 'drop-shadow(0 0 5px white)';
            setTimeout(() => hm.style.opacity = 0, 150);
        }

        function updateCrosshair(expansion) {
            const cls = document.getElementsByClassName('ch-line');
            if(cls.length < 4) return;
            cls[0].style.transform = `translateY(-${expansion}px)`;
            cls[1].style.transform = `translateY(${expansion}px)`;
            cls[2].style.transform = `translateX(-${expansion}px)`;
            cls[3].style.transform = `translateX(${expansion}px)`;
            setTimeout(()=>{
                cls[0].style.transform = `translateY(0)`; cls[1].style.transform = `translateY(0)`;
                cls[2].style.transform = `translateX(0)`; cls[3].style.transform = `translateX(0)`;
            }, 100);
        }

        // ==========================================
        // 6. 네트워킹 리시버 & 데스/리스폰
        // ==========================================
        function updateRemotePlayer(data) {
            if(!Engine.enemies[data.name]) createEnemyModel(data.name, data.name);
            const e = Engine.enemies[data.name];
            e.mesh.position.lerp(new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), 0.3);
            e.mesh.rotation.y = data.rot;
            if(e.hp !== data.hp) { e.hp = data.hp; updateEnemyUI(data.name); }
        }

        function renderOtherShoot(data) { createTracerLine(new THREE.Vector3(data.start.x, data.start.y, data.start.z), new THREE.Vector3(data.end.x, data.end.y, data.end.z), data.color); playSound('shoot'); }

        function handleTakeDamage(data) {
            if(data.target === GameState.username && !GameState.isDead) {
                GameState.hp -= data.damage; updateHUD();
                const overlay = document.getElementById('damage-overlay');
                if(overlay) { overlay.style.opacity = 1; setTimeout(() => overlay.style.opacity = 0, 200); }
                
                euler.setFromQuaternion(Engine.camera.quaternion);
                euler.x += (Math.random()-0.5)*0.15; euler.y += (Math.random()-0.5)*0.15;
                Engine.camera.quaternion.setFromEuler(euler);

                if(GameState.hp <= 0) die();
            } else {
                if(Engine.enemies[data.target]) {
                    Engine.enemies[data.target].torso.material.emissive.setHex(0xff0000);
                    setTimeout(() => { if(Engine.enemies[data.target]) Engine.enemies[data.target].torso.material.emissive.setHex(0x000000); }, 100);
                }
            }
        }

        function handleKillMsg(data) {
            const ul = document.getElementById('killfeed'); 
            if(ul) {
                const li = document.createElement('li');
                li.innerHTML = `<span style="color:#00aaff">${data.killer}</span> 🔫 <span style="color:#ff3366">${data.victim}</span>`;
                ul.appendChild(li); setTimeout(() => li.remove(), 4000);
            }
            if(data.killer === GameState.username) { 
                GameState.kills++; GameState.keys += 1;
                const elKeys = document.getElementById('ui-keys'); if(elKeys) elKeys.innerText = GameState.keys;
                updateHUD(); 
            }
        }

        function handleEnemyRespawn(data) { if(Engine.enemies[data.name]) { Engine.enemies[data.name].hp = 100; updateEnemyUI(data.name); } }

        function die() {
            GameState.isDead = true; GameState.hp = 0; updateHUD();
            GameState.conn.send({ type: 'killmsg', killer: "Enemy", victim: GameState.username });
            handleKillMsg({killer: "Enemy", victim: GameState.username});

            const rUI = document.getElementById('respawn-ui'); if(rUI) rUI.classList.remove('hidden');
            if(isPointerLocked) document.exitPointerLock();

            Engine.camera.position.y = 0.2; Engine.camera.rotation.z = Math.PI / 4;

            let timeLeft = 3; const timerEl = document.getElementById('respawn-timer');
            const interval = setInterval(() => {
                timeLeft--; if(timerEl) timerEl.innerText = `${timeLeft}초 후 부활...`;
                if(timeLeft <= 0) { clearInterval(interval); respawnPlayer(); }
            }, 1000);
        }

        function respawnPlayer() {
            GameState.isDead = false; GameState.hp = 100; GameState.ammo = getCurWeapon().mag;
            updateHUD();
            // 랜덤 진영 스폰
            const teamOffset = Math.random() > 0.5 ? 40 : -40;
            Engine.camera.position.set(Math.random()*10-5, 5.0, teamOffset + (Math.random()*10-5));
            Engine.camera.rotation.set(0, teamOffset > 0 ? Math.PI : 0, 0);
            
            const rUI = document.getElementById('respawn-ui'); if(rUI) rUI.classList.add('hidden');
            GameState.conn.send({ type: 'respawn', name: GameState.username });
        }

        // ==========================================
        // 7. 메인 루프 (물리 적용)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = Math.min((time - lastTime) / 1000, 0.1); lastTime = time;

            if (!GameState.isDead) {
                if(isShootingHeld && getCurWeapon().auto) tryAction();

                if(GameState.dashCooldown > 0) {
                    GameState.dashCooldown -= delta;
                    const dFill = document.getElementById('dash-fill');
                    if(dFill) dFill.style.width = `${((3.0 - GameState.dashCooldown)/3.0)*100}%`;
                }

                velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;

                direction.x = (Number(moveR) - Number(moveL)) + joyDir.x;
                direction.z = (Number(moveB) - Number(moveF)) + joyDir.y;
                if(direction.length() > 1.0) direction.normalize();

                velocity.x -= direction.x * 200.0 * delta; velocity.z -= direction.z * 200.0 * delta;

                // 물리 엔진 및 AABB 충돌 적용 (engine.js)
                canJump = applyPhysicsAndCollision(Engine.camera, velocity, delta, false);

                // 반동
                currentRecoil.lerp(recoilTarget, 20 * delta); recoilTarget.lerp(new THREE.Vector3(0,0,0), 12 * delta);

                if(Engine.myGunMesh && !GameState.isReloading) {
                    let swayY = (direction.lengthSq() > 0.1 && canJump) ? Math.sin(time*0.015)*0.015 : Math.sin(time*0.003)*0.003; 
                    Engine.myGunMesh.position.y = -0.25 + swayY + currentRecoil.y;
                    Engine.myGunMesh.position.z = -0.4 + currentRecoil.z;
                    Engine.myGunMesh.rotation.x = currentRecoil.x;
                }
            }

            for(let i = Engine.tracers.length-1; i>=0; i--) {
                Engine.tracers[i].life -= delta * 5;
                if(Engine.tracers[i].life <= 0) { Engine.scene.remove(Engine.tracers[i].mesh); Engine.tracers.splice(i, 1); } 
                else Engine.tracers[i].mesh.material.opacity = Engine.tracers[i].life;
            }
            if(Engine.composer) Engine.composer.render();
        }
    </script>
