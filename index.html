<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #eef2f5; font-family: 'Orbitron', sans-serif; color: #fff; user-select: none; touch-action: none; -webkit-touch-callout: none; }

h1 { font-size: 2.5rem; text-shadow: 0 4px 10px rgba(0, 150, 255, 0.3); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; color: #0055ff; }
h2 { font-size: 1.5rem; color: #ff0055; }
input { width: 80%; padding: 12px; margin: 10px 0; background: #f0f5ff; border: 2px solid #00aaff; border-radius: 8px; color: #111; font-size: 1.2rem; text-align: center; outline: none; font-family: inherit; transition: 0.2s; font-weight: bold; }

@keyframes pulse { 0% { box-shadow: 0 0 10px #ff9900; } 50% { box-shadow: 0 0 30px #ff0055; } 100% { box-shadow: 0 0 10px #ff9900; } }

/* 인게임 HUD (다이나믹 크로스헤어 포함) */
#crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }

#hitmarker { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); z-index: 6; opacity: 0; transition: opacity 0.1s; background-image: linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%); filter: drop-shadow(0 0 5px #fff); pointer-events: none; }

#hud-bottom-left { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-size: 1.2rem; text-shadow: 0 0 10px #0ff; background: rgba(0,20,40,0.8); padding: 15px; border-radius: 10px; border-left: 4px solid #00aaff; color: #fff; }
#hud-bottom-right { position: absolute; bottom: 20px; right: 20px; z-index: 10; font-size: 2.5rem; font-weight: 900; text-shadow: 0 0 15px #0ff; text-align: right; background: rgba(0,20,40,0.8); padding: 10px 20px; border-radius: 10px; border-right: 4px solid #00aaff; color: #fff; }
#hud-top-right { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0,20,40,0.7); padding: 10px; border-radius: 8px; width: 220px; font-size: 0.9rem; border-top: 2px solid #00aaff; color: #fff; }
#killfeed { list-style: none; padding: 0; margin: 0; color: #fff; }

/* 미니맵 */
#minimap { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; background: rgba(0,20,40,0.6); border: 2px solid #00aaff; border-radius: 50%; z-index: 10; overflow: hidden; }
#minimap-player { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 5px #0f0; }

/* 인벤토리 UI */
#inventory-ui { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
.inv-item { background: rgba(0,0,0,0.05); border: 2px solid #aaa; padding: 10px; border-radius: 5px; cursor: pointer; width: 40%; font-size: 0.9rem; transition: 0.2s; font-weight: bold; }
.inv-item:hover { background: rgba(0,170,255,0.1); }
.inv-item.equipped { border-color: #00aaff; background: rgba(0,170,255,0.2); box-shadow: 0 0 15px rgba(0,170,255,0.5); }

#damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.4) 100%); z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.2s; }

/* 모바일 컨트롤러 완벽 분리 설계 */
#mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; display: none; }
.touch-btn { position: absolute; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: rgba(255,255,255,0.9); backdrop-filter: blur(4px); transition: transform 0.1s; user-select: none; }

#joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.4); }
#joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0,150,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #0ff; pointer-events: none; }

/* 우측 시야 조절 영역 (화면 전체의 우측 절반) */
#look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 14; }

/* 동작 버튼들은 시야 조절 영역보다 위에 배치 (z-index) */
.action-btns { z-index: 16; }
#shoot-btn { bottom: 40px; right: 40px; width: 80px; height: 80px; border-color: #ffaa00; color: #ffaa00; font-size: 1.1rem; }
#aim-btn { bottom: 140px; right: 40px; width: 60px; height: 60px; border-color: #00ffaa; color: #00ffaa; font-size: 0.9rem;}
#jump-btn { bottom: 40px; right: 140px; width: 60px; height: 60px; border-color: #ff00ff; color: #ff00ff; font-size: 0.9rem;}
#crouch-btn { bottom: 120px; right: 120px; width: 50px; height: 50px; font-size: 0.7rem; }
#sprint-btn { bottom: 190px; left: 80px; width: 60px; height: 60px; font-size: 0.8rem; border-color: #0ff; }
#reload-btn { bottom: 210px; right: 40px; width: 50px; height: 50px; font-size: 0.7rem; }

.grade-legendary { color: #ff8800; text-shadow: 0 0 10px #ff8800; }
.grade-epic { color: #aa00ff; }
.grade-rare { color: #0055ff; }
.grade-normal { color: #555; }
</style>
</head>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.158.0';
import { EffectComposer } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://esm.sh/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ==========================================
// 1. 오디오 시스템 (발소리, 근접 공격 추가)
// ==========================================
const actx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
if(actx.state === 'suspended') actx.resume();
const osc = actx.createOscillator();
const gain = actx.createGain();
osc.connect(gain); gain.connect(actx.destination);
const now = actx.currentTime;

if(type === 'shoot') {
osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
} else if(type === 'hit') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1000, now);
gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
osc.start(now); osc.stop(now + 0.05);
} else if(type === 'reload') {
osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(400, now + 0.4);
gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
osc.start(now); osc.stop(now + 0.4);
} else if(type === 'empty') {
osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
osc.start(now); osc.stop(now + 0.05);
} else if(type === 'step') {
// 발소리 노이즈 흉내
osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.05);
gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
osc.start(now); osc.stop(now + 0.05);
} else if(type === 'melee') {
osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
osc.start(now); osc.stop(now + 0.2);
}
}

// ==========================================
// 2. 무기 데이터베이스 (근접 무기 추가 및 모델링 파라미터)
// ==========================================
const WeaponDB = [
{ id: 0, type: 'ranged', name: "전술 펄스 권총", grade: "normal", color: 0x555555, glow: 0x00ffff, damage: 15, fireRate: 300, mag: 12, auto: false, spread: 0.015, recoil: 0.02, range: 100 },
{ id: 1, type: 'ranged', name: "고속 벡터 SMG", grade: "rare", color: 0x222222, glow: 0x0055ff, damage: 9, fireRate: 85, mag: 35, auto: true, spread: 0.04, recoil: 0.015, range: 60 },
{ id: 2, type: 'ranged', name: "헤비 컴뱃 샷건", grade: "epic", color: 0x333333, glow: 0xaa00ff, damage: 12, fireRate: 850, mag: 6, auto: false, spread: 0.1, recoil: 0.15, pellets: 7, range: 30 },
{ id: 3, type: 'ranged', name: "광자 스나이퍼 빔", grade: "legendary", color: 0x111111, glow: 0xff8800, damage: 95, fireRate: 1500, mag: 5, auto: false, spread: 0.001, recoil: 0.25, range: 300 },
{ id: 4, type: 'melee', name: "광학 사이버 카타나", grade: "legendary", color: 0x111111, glow: 0xff0055, damage: 60, fireRate: 500, mag: 999, auto: true, spread: 0, recoil: 0, range: 3.5 }
 ];

window.GameState = {
username: '', peer: null, conn: null, isHost: false, roomCode: '',
hp: 100, kills: 0, isDead: false,
inventory: [WeaponDB[0]],
equippedWeaponIndex: 0, ammo: 12, lastShotTime: 0, isReloading: false, lastHitTime: 0,
isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent) || ('ontouchstart' in window)
};

const PEER_PREFIX = 'neonQ-v3-';

let scene, camera, renderer, composer;
let myGunMesh, gunBarrelEnd, katanaBlade;
const enemies = {};

const tracers = []; const particles = []; const damageTexts = []; const decals = [];

// 이동/물리 제어
const velocity = new THREE.Vector3(); const direction = new THREE.Vector3();
let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
let isSprinting = false, isCrouching = false;

let joyDir = { x: 0, y: 0 };
let isPointerLocked = false;
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
let lastTime = performance.now();
let stepTimer = 0;

// 사격/조준/스윙
let isShootingHeld = false;
let isAiming = false;
let isSwinging = false; // 카타나용
let recoilTarget = new THREE.Vector3(0,0,0);
let currentRecoil = new THREE.Vector3(0,0,0);

// ==========================================
// 3. UI 바인딩
// ==========================================
window.login = () => {
const name = document.getElementById('username-input').value.trim();
if(!name) return alert('요원 이름을 입력해야 합니다.');
window.GameState.username = name;
window.GameState.peer = new Peer({ config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}});
window.GameState.peer.on('error', (err) => console.log('Peer Error:', err));
document.getElementById('welcome-msg').innerText = `접속 완료: ${name} 요원`;
document.getElementById('login-ui').classList.add('hidden');
document.getElementById('lobby-ui').classList.remove('hidden');
};

window.showGacha = () => { document.getElementById('lobby-ui').classList.add('hidden'); document.getElementById('gacha-ui').classList.remove('hidden'); };
window.hideGacha = () => { document.getElementById('gacha-ui').classList.add('hidden'); document.getElementById('lobby-ui').classList.remove('hidden'); };

window.pullGacha = () => {
const rand = Math.random();
let wp = (rand < 0.05) ? WeaponDB[4] : (rand < 0.1) ? WeaponDB[3] : (rand < 0.3) ? WeaponDB[2] : (rand < 0.6) ? WeaponDB[1] : WeaponDB[0];

if(!window.GameState.inventory.find(w => w.id === wp.id)) { window.GameState.inventory.push(wp); }

const resEl = document.getElementById('gacha-result');
const statEl = document.getElementById('gacha-stats');
resEl.innerText = wp.name; resEl.className = 'grade-' + wp.grade;
statEl.innerHTML = 데미지:${wp.damage} | 연사속도: {wp.type === 'melee' ? '근접 타격' : '원거리 사격'}`;

resEl.style.transform = 'scale(1.3)';
setTimeout(() => resEl.style.transform = 'scale(1)', 150);
};

window.showInventory = () => {
const ui = document.getElementById('inventory-ui');
ui.innerHTML = '';
window.GameState.inventory.forEach((wp, index) => {
const div = document.createElement('div');
div.className = inv-item ${index === window.GameState.equippedWeaponIndex ? 'equipped' : ''} grade-${wp.grade};
div.innerHTML = ${wp.name}<br><span style="font-size:0.7rem; color:#888;">${wp.type==='melee'?'근접':'원거리'}&lt;/span>;
div.onclick = () => {
window.GameState.equippedWeaponIndex = index;
window.GameState.ammo = wp.mag;
window.hideInventory();
updateHUD();
if(scene) buildMyGun();
};
ui.appendChild(div);
});
document.getElementById('lobby-ui').classList.add('hidden');
document.getElementById('inventory-ui-panel').classList.remove('hidden');
};
window.hideInventory = () => { document.getElementById('inventory-ui-panel').classList.add('hidden'); document.getElementById('lobby-ui').classList.remove('hidden'); };

function setupNetwork() {
window.GameState.conn.on('data', (data) => {
if (data.type === 'start') initGame();
else if (data.type === 'update') updateEnemyState(data);
else if (data.type === 'shoot') renderOtherShoot(data);
else if (data.type === 'hit') handleTakeDamage(data);
else if (data.type === 'killmsg') handleKillMsg(data);
else if (data.type === 'respawn') handleEnemyRespawn(data);
});
}

window.createRoom = () => {
const code = Math.random().toString(36).substring(2, 5).toUpperCase();
window.GameState.peer.destroy();
window.GameState.peer = new Peer(PEER_PREFIX + code);
window.GameState.peer.on('open', () => {
document.getElementById('room-code-display').innerText = code;
document.getElementById('lobby-ui').classList.add('hidden');
document.getElementById('room-ui').classList.remove('hidden');
window.GameState.isHost = true;
});
window.GameState.peer.on('connection', (conn) => {
window.GameState.conn = conn; setupNetwork();
document.getElementById('connection-status').innerText = "상대방 접속 완료!";
document.getElementById('btn-start-game').style.display = 'block';
});
};

window.joinRoom = () => {
const code = document.getElementById('room-code-input').value.toUpperCase();
window.GameState.conn = window.GameState.peer.connect(PEER_PREFIX + code);
window.GameState.conn.on('open', () => {
setupNetwork();
document.getElementById('room-code-display').innerText = code;
document.getElementById('lobby-ui').classList.add('hidden');
document.getElementById('room-ui').classList.remove('hidden');
document.getElementById('connection-status').innerText = "방장 연결 완료. 대기중...";
});
};

window.startGame = () => {

// ==========================================
// 4. 초고퀄리티 밝은 맵 렌더러 설정
// ==========================================
function initGame() {
if(actx.state === 'suspended') actx.resume();

document.getElementById('room-ui').classList.add('hidden');
document.getElementById('game-ui').classList.remove('hidden');
window.GameState.ammo = getCurWeapon().mag;
updateHUD();

const container = document.getElementById('game-container');
scene = new THREE.Scene();
// 밝고 세련된 안개 및 배경 (Sci-fi White/Blue)
scene.background = new THREE.Color(0xddeeff);
scene.fog = new THREE.FogExp2(0xddeeff, 0.008);

camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';

renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.GameState.isMobile ? 1 : Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; // 그림자 켜기
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const renderScene = new RenderPass(scene, camera);
// 불빛 세기를 대폭 낮추고 부드럽게 (Glare 제거)
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.5, 0.9);
composer = new EffectComposer(renderer);
composer.addPass(renderScene); composer.addPass(bloomPass);

// 조명 세팅 (매우 밝게)
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(50, 100, 50);
dl.castShadow = true;
dl.shadow.mapSize.width = 2048; dl.shadow.mapSize.height = 2048;
dl.shadow.camera.near = 0.5; dl.shadow.camera.far = 300;
const d = 100; dl.shadow.camera.left = -d; dl.shadow.camera.right = d; dl.shadow.camera.top = d; dl.shadow.camera.bottom = -d;
scene.add(dl);

buildComplexMap();
buildMyGun();
setupControls();
respawnPlayer();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
composer.setSize(window.innerWidth, window.innerHeight);
});

lastTime = performance.now();
animate();

setInterval(() => {
if(window.GameState.conn && !window.GameState.isDead) {
window.GameState.conn.send({ type: 'update', name: window.GameState.username, hp: window.GameState.hp, pos: camera.position, rot: camera.rotation.y });
}
}, 50);
}

function buildComplexMap() {
// 바닥
const floorMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.3, metalness: 0.1});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

// 육각/사각 복합 구조물 배치
const bMat1 = new THREE.MeshStandardMaterial({color: 0xf0f0f0, roughness: 0.2});
const glassMat = new THREE.MeshPhysicalMaterial({color: 0x0088ff, transmission: 0.8, opacity: 1, transparent: true, roughness: 0.1});

for(let i=0; i<40; i++) {
const isGlass = Math.random() > 0.8;
const geo = new THREE.BoxGeometry(4 + Math.random()*6, 6 + Math.random()*8, 4 + Math.random()*6);
const box = new THREE.Mesh(geo, isGlass ? glassMat : bMat1);
box.position.set(Math.random()*200-100, geo.parameters.height/2, Math.random()*200-100);
box.castShadow = !isGlass; box.receiveShadow = true;

// 빛나는 띠
if(!isGlass) {
const edgeGeo = new THREE.BoxGeometry(geo.parameters.width+0.1, 0.5, geo.parameters.depth+0.1);
const edge = new THREE.Mesh(edgeGeo, new THREE.MeshBasicMaterial({color: 0x00aaff}));
edge.position.y = geo.parameters.height/2 - 1;
box.add(edge);
}
scene.add(box);
}

// 경사로(Ramp)
const rampGeo = new THREE.BoxGeometry(10, 1, 20);
const ramp = new THREE.Mesh(rampGeo, bMat1);
ramp.rotation.x = Math.PI / 8;
ramp.position.set(0, 2, -20);
ramp.castShadow = true; ramp.receiveShadow = true;
scene.add(ramp);
}

// 네온 포인트

// ==========================================
// 6. 완벽한 입력 분리 시스템 (PC/Mobile)
// ==========================================
function setupControls() {
if (window.GameState.isMobile) {
document.getElementById('mobile-controls').style.display = 'block';

// 조이스틱
let joyId = null;
const jz = document.getElementById('joystick-zone'), jk = document.getElementById('joystick-knob');

jz.addEventListener('touchstart', (e) => { e.preventDefault();
for(let t of e.changedTouches) { if(joyId === null) { joyId = t.identifier; updateJoy(t); break; } }
}, {passive:false});

jz.addEventListener('touchmove', (e) => { e.preventDefault();
for(let t of e.changedTouches) { if(t.identifier === joyId) { updateJoy(t); break; } }
}, {passive:false});

const endJoy = (e) => { e.preventDefault();
for(let t of e.changedTouches) { if(t.identifier === joyId) { joyId = null; joyDir={x:0,y:0}; jk.style.transform='translate(-50%,-50%)'; break; } }
};
jz.addEventListener('touchend', endJoy, {passive:false}); jz.addEventListener('touchcancel', endJoy, {passive:false});

function updateJoy(t) {
const r = jz.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2;
let dx = t.clientX - cx, dy = t.clientY - cy; const dist = Math.sqrt(dxdx + dydy);
if(dist > 50) { dx = (dx/dist)*50; dy = (dy/dist)*50; }
jk.style.transform = translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px));
joyDir.x = dx/50; joyDir.y = dy/50;
}

// 우측 시야 조절 영역 (절대 좌표 델타 사용 -> 튀는 현상 해결)
let lookId = null; let lastLookX = 0, lastLookY = 0;
const lz = document.getElementById('look-zone');

lz.addEventListener('touchstart', (e) => { e.preventDefault();
for(let t of e.changedTouches) {
if(lookId === null) { lookId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; break; }
}
}, {passive:false});

lz.addEventListener('touchmove', (e) => { e.preventDefault();
for(let t of e.changedTouches) {
if(t.identifier === lookId) {
const curX = t.clientX, curY = t.clientY;
const deltaX = curX - lastLookX, deltaY = curY - lastLookY;

euler.setFromQuaternion(camera.quaternion);
const sens = isAiming ? 0.002 : 0.005;
euler.y -= deltaX * sens; euler.x -= deltaY * sens;
euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
camera.quaternion.setFromEuler(euler);

lastLookX = curX; lastLookY = curY; break;
}
}
}, {passive:false});

const endLook = (e) => { e.preventDefault();
for(let t of e.changedTouches) { if(t.identifier === lookId) { lookId = null; break; } }
};
lz.addEventListener('touchend', endLook, {passive:false}); lz.addEventListener('touchcancel', endLook, {passive:false});

// 모바일 액션 버튼
function bindBtn(id, onDown, onUp) {
const btn = document.getElementById(id);
btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); btn.style.transform='scale(0.9)'; if(onDown) onDown(); }, {passive:false});
const end = (e)=>{ e.preventDefault(); e.stopPropagation(); btn.style.transform='scale(1)'; if(onUp) onUp(); };
btn.addEventListener('touchend', end, {passive:false}); btn.addEventListener('touchcancel', end, {passive:false});
}
bindBtn('shoot-btn', () => { isShootingHeld = true; tryShoot(); }, () => { isShootingHeld = false; });
bindBtn('aim-btn', () => { isAiming = !isAiming; });
bindBtn('jump-btn', doJump);
bindBtn('reload-btn', doReload);
bindBtn('crouch-btn', () => { isCrouching = !isCrouching; });
bindBtn('sprint-btn', () => { isSprinting = true; isAiming=false; isCrouching=false; }, () => { isSprinting = false; });

} else {
// PC 제어
document.addEventListener('keydown', (e) => {
if(e.code==='KeyW') moveF=true; if(e.code==='KeyS') moveB=true;
if(e.code==='KeyA') moveL=true; if(e.code==='KeyD') moveR=true;
if(e.code==='Space') doJump(); if(e.code==='KeyR') doReload();
if(e.code==='KeyC') isCrouching = !isCrouching;
if(e.code==='ShiftLeft') { isSprinting = true; isCrouching = false; isAiming = false; }
});
document.addEventListener('keyup', (e) => {
if(e.code==='KeyW') moveF=false; if(e.code==='KeyS') moveB=false;
if(e.code==='KeyA') moveL=false; if(e.code==='KeyD') moveR=false;
if(e.code==='ShiftLeft') isSprinting = false;
});
document.addEventListener('pointerlockchange', () => isPointerLocked = (document.pointerLockElement === document.body));

document.addEventListener('mousedown', (e) => {
if(window.GameState.isDead) return;
if(!isPointerLocked) { document.body.requestPointerLock().catch(()=>{}); return; }
if(e.button === 0) { isShootingHeld = true; tryShoot(); }
if(e.button === 2) { isAiming = true; isSprinting = false; }
});
document.addEventListener('mouseup', (e) => {
if(e.button === 0) isShootingHeld = false;
if(e.button === 2) isAiming = false;
});
document.addEventListener('mousemove', (e) => {
if(!isPointerLocked || window.GameState.isDead) return;
euler.setFromQuaternion(camera.quaternion);
const sensitivity = isAiming ? 0.001 : 0.002;
euler.y -= e.movementX * sensitivity; euler.x -= e.movementY * sensitivity;
euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
camera.quaternion.setFromEuler(euler);
});
}
}

function doJump() { if(canJump && !window.GameState.isDead && !isCrouching) { velocity.y = 12; canJump = false; } }

function doReload() {
if(window.GameState.isReloading || window.GameState.isDead || getCurWeapon().type === 'melee') return;
const wp = getCurWeapon();
if(window.GameState.ammo === wp.mag) return;

window.GameState.isReloading = true; isAiming = false;
playSound('reload'); document.getElementById('hud-ammo').innerText = "R";

recoilTarget.y = -0.5; recoilTarget.x = Math.PI / 4;
setTimeout(() => {
window.GameState.ammo = wp.mag; window.GameState.isReloading = false;
recoilTarget.set(0,0,0); updateHUD();
}, 1000);
}

function updateHUD() {
document.getElementById('hud-name').innerText = window.GameState.username;
document.getElementById('hud-hp').innerText = window.GameState.hp;
document.getElementById('hud-weapon').innerText = getCurWeapon().name;
document.getElementById('hud-ammo').innerText = getCurWeapon().type==='melee' ? "∞" : window.GameState.ammo;
document.getElementById('hud-maxammo').innerText = getCurWeapon().type==='melee' ? "∞" : getCurWeapon().mag;
document.getElementById('hud-kills').innerText = window.GameState.kills;
}

// ==========================================
// 7. 사격 및 근접 공격 처리 (데칼 포함)
// ==========================================
function tryShoot() {
if(window.GameState.isDead || window.GameState.isReloading) return;
const now = performance.now();
const wp = getCurWeapon();
if (now - window.GameState.lastShotTime < wp.fireRate) return;

if(wp.type === 'ranged') {
if (window.GameState.ammo <= 0) {
if(now - window.GameState.lastShotTime > 500) { playSound('empty'); window.GameState.lastShotTime = now; }
return;
}
window.GameState.ammo--; updateHUD(); playSound('shoot');
const pellets = wp.pellets || 1;
for(let i=0; i<pellets; i++) processHitscan(wp);

// 사격 반동
recoilTarget.z += wp.recoil * 1.5; recoilTarget.x += wp.recoil * 0.8;
euler.setFromQuaternion(camera.quaternion); euler.x += wp.recoil * 0.15; camera.quaternion.setFromEuler(euler);

} else if(wp.type === 'melee') {
// 카타나 공격
playSound('melee');
isSwinging = true;
recoilTarget.x = -Math.PI/3; recoilTarget.y = -0.3; // 크게 벰
setTimeout(()=> { isSwinging = false; recoilTarget.set(0,0,0); }, 200);
processMelee(wp);
}
window.GameState.lastShotTime = now;
}

function getIntersectObj(raycaster) {
const enemyMeshes = [];
for(let id in enemies) {
enemyMeshes.push(enemies[id].mesh.children[0]);
enemyMeshes.push(enemies[id].mesh.children[1]);
enemies[id].mesh.children[0].userData = {id: id, type: 'body'};
enemies[id].mesh.children[1].userData = {id: id, type: 'head'};
}
const allTargets = [...scene.children.filter(c => c.geometry && c.geometry.type === 'BoxGeometry'), ...enemyMeshes];
return raycaster.intersectObjects(allTargets, false);
}

function processHitscan(wp) {
const rc = new THREE.Raycaster(); const center = new THREE.Vector2(0,0);

// 크로스헤어(탄퍼짐) 시스템 계산
let spreadMulti = isAiming ? 0.2 : (isCrouching ? 0.5 : (isSprinting ? 2.5 : 1.0));
if(velocity.length() > 0.5 && !isAiming) spreadMulti *= 1.5; // 이동시 패널티

center.x += (Math.random()-0.5) * wp.spread * spreadMulti;
center.y += (Math.random()-0.5) * wp.spread * spreadMulti;
rc.setFromCamera(center, camera);

let targetPoint; let hitEnemyId = null; let isHeadshot = false; let hitNormal = null;

const intersects = getIntersectObj(rc);

if(intersects.length > 0 && intersects[0].distance <= wp.range) {
targetPoint = intersects[0].point;
hitNormal = intersects[0].face.normal;
const hitObj = intersects[0].object;

if(hitObj.userData && hitObj.userData.id) {
hitEnemyId = hitObj.userData.id;
if(hitObj.userData.type === 'head') isHeadshot = true;
} else {
// 벽 타격 -> 총알 자국(데칼) 생성
createDecal(targetPoint, hitNormal);
}
} else {
targetPoint = rc.ray.direction.clone().multiplyScalar(wp.range).add(camera.position);
}

const startPoint = new THREE.Vector3(); gunBarrelEnd.getWorldPosition(startPoint);
createTracerLine(startPoint, targetPoint, wp.glow);
if(hitNormal) createSparks(targetPoint, wp.glow);

if(window.GameState.conn) {
window.GameState.conn.send({ type: 'shoot', start: startPoint, end: targetPoint, color: wp.glow });
if(hitEnemyId) {
let finalDmg = isHeadshot ? wp.damage * 2 : wp.damage;
window.GameState.conn.send({ type: 'hit', target: hitEnemyId, damage: finalDmg, isHead: isHeadshot, pos: targetPoint });
showHitMarker(isHeadshot); playSound('hit');
}
}
}

function processMelee(wp) {
const rc = new THREE.Raycaster();
rc.setFromCamera(new THREE.Vector2(0,0), camera);
const intersects = getIntersectObj(rc);

if(intersects.length > 0 && intersects[0].distance <= wp.range) {
const hitObj = intersects[0].object;
if(hitObj.userData && hitObj.userData.id) {
let finalDmg = wp.damage;
window.GameState.conn.send({ type: 'hit', target: hitObj.userData.id, damage: finalDmg, isHead: false, pos: intersects[0].point });
showHitMarker(false); playSound('hit');
} else {
createDecal(intersects[0].point, intersects[0].face.normal, true);
}
}
}

// ==========================================
// 8. 시각 효과 (탄흔, 텍스트, 크로스헤어 UI)
// ==========================================
function createDecal(pos, normal, isMelee = false) {
// 벽 총알 자국
const size = isMelee ? 0.4 : 0.1;
const geo = new THREE.PlaneGeometry(size, size);
const mat = new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.8, depthWrite: false});
const decal = new THREE.Mesh(geo, mat);
decal.position.copy(pos).add(normal.clone().multiplyScalar(0.01));
decal.lookAt(pos.clone().add(normal));
// 랜덤 회전 (베인 자국 느낌)
if(isMelee) decal.rotation.z = Math.random() * Math.PI;
scene.add(decal);
decals.push({mesh: decal, life: 10.0}); // 10초 후 사라짐
}

function createTracerLine(start, end, colorHex) {
const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 1 });
const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), mat);
scene.add(line); tracers.push({ mesh: line, life: 1.0 });
}

function createSparks(pos, colorHex) {
const geo = new THREE.BoxGeometry(0.05, 0.05, 0.05); const mat = new THREE.MeshBasicMaterial({color: colorHex});
for(let i=0; i<4; i++) {
const mesh = new THREE.Mesh(geo, mat); mesh.position.copy(pos);
const vel = new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10);
scene.add(mesh); particles.push({ mesh: mesh, vel: vel, life: 1.0 });
}
}

function showHitMarker(isHead) {
const hm = document.getElementById('hitmarker');
hm.style.opacity = 1; hm.style.filter = isHead ? 'drop-shadow(0 0 8px red)' : 'drop-shadow(0 0 5px white)';
setTimeout(() => hm.style.opacity = 0, 150);
}

function showDamageText(amount, pos, isHead) {
const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 64;
const ctx = canvas.getContext('2d');
ctx.fillStyle = isHead ? '#ff0055' : '#00aaff'; ctx.font = 'bold 45px Orbitron'; ctx.textAlign = 'center';
ctx.fillText(isHead ? CRIT ${amount}` : amount, 64, 45);
const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
sprite.position.copy(pos); sprite.position.y += 0.5;
scene.add(sprite); damageTexts.push({ sprite: sprite, life: 1.0 });
}

function updateDynamicCrosshair(delta, isMoving) {
if(isAiming || getCurWeapon().type === 'melee') {
document.getElementById('crosshair-container').style.opacity = 0;
return;
}
document.getElementById('crosshair-container').style.opacity = 1;

// 크로스헤어 벌어짐 정도 계산
let targetGap = 15;
if(isCrouching) targetGap = 8;
if(isSprinting) targetGap = 30;
if(isMoving && !isSprinting) targetGap += 10;
if(now() - window.GameState.lastShotTime < 100) targetGap += 15;

document.getElementById('ch-top').style.transform = translateY(-${targetGap}px); document.getElementById('ch-bottom').style.transform =translateY({targetGap}px); document.getElementById('ch-right').style.transform =translateX(${targetGap}px);
}
function now() { return performance.now(); }

// ==========================================
// 9. 네트워크 수신 및 사망 처리
// ==========================================
function updateEnemyState(data) {
if(!enemies[data.name]) createEnemyModel(data.name, data.name);
const e = enemies[data.name];
e.mesh.position.lerp(new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), 0.3);
e.mesh.rotation.y = data.rot;
if(e.hp !== data.hp) { e.hp = data.hp; updateEnemyUI(data.name); }

// 미니맵 업데이트
const pX = camera.position.x, pZ = camera.position.z;
const eX = data.pos.x, eZ = data.pos.z;
const mPlayer = document.getElementById('minimap-player');
// 상대좌표 계산 (간단한 구현)
const mapScale = 0.5;
const dx = (eX - pX) * mapScale; const dy = (eZ - pZ) * mapScale;
// 미니맵 중앙(60,60)에서 위치
if(dx > -60 && dx < 60 && dy > -60 && dy < 60) {
mPlayer.style.display = 'block';
mPlayer.style.left = (60 + dx) + 'px';
mPlayer.style.top = (60 + dy) + 'px';
} else {
mPlayer.style.display = 'none';
}
}

function renderOtherShoot(data) {
createTracerLine(new THREE.Vector3(data.start.x, data.start.y, data.start.z), new THREE.Vector3(data.end.x, data.end.y, data.end.z), data.color);
playSound('shoot');
}

function handleTakeDamage(data) {
if(data.target === window.GameState.username && !window.GameState.isDead) {
window.GameState.hp -= data.damage; updateHUD();
window.GameState.lastHitTime = performance.now(); // 피격 시간 갱신 (리젠 타이머 초기화)

const overlay = document.getElementById('damage-overlay');
overlay.style.opacity = 1; setTimeout(() => overlay.style.opacity = 0, 200);

euler.setFromQuaternion(camera.quaternion);
euler.x += (Math.random()-0.5)*0.15; euler.y += (Math.random()-0.5)*0.15;
camera.quaternion.setFromEuler(euler);

if(window.GameState.hp <= 0) die();
} else {
showDamageText(data.damage, new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), data.isHead);
}
}

function handleKillMsg(data) {
const ul = document.getElementById('killfeed'); const li = document.createElement('li');
li.innerHTML = <span style="color:#00aaff"&gt;${data.killer}</span> 🔫 <span style="color:#ff0055">${data.victim}&lt;/span>;
ul.appendChild(li); setTimeout(() => li.remove(), 4000);
if(data.killer === window.GameState.username) { window.GameState.kills++; updateHUD(); }
}

function handleEnemyRespawn(data) { if(enemies[data.name]) { enemies[data.name].hp = 100; updateEnemyUI(data.name); } }

function die() {
window.GameState.isDead = true; window.GameState.hp = 0; updateHUD();
window.GameState.conn.send({ type: 'killmsg', killer: "Enemy", victim: window.GameState.username });
handleKillMsg({killer: "Enemy", victim: window.GameState.username});

document.getElementById('respawn-ui').classList.remove('hidden');
if(isPointerLocked) document.exitPointerLock();

camera.position.y = 0.2; camera.rotation.z = Math.PI / 4;
isAiming = false; isSprinting = false;

let timeLeft = 3; const timerEl = document.getElementById('respawn-timer');
const interval = setInterval(() => {
timeLeft--; timerEl.innerText = ``${timeLeft}초 후 재배치...`;
if(timeLeft <= 0) { clearInterval(interval); respawnPlayer(); }
}, 1000);
}

function respawnPlayer() {
window.GameState.isDead = false; window.GameState.hp = 100; window.GameState.ammo = getCurWeapon().mag;
updateHUD();
camera.position.set(Math.random()*120-60, 2.0, Math.random()*120-60);
camera.rotation.set(0,0,0);
document.getElementById('respawn-ui').classList.add('hidden');
window.GameState.conn.send({ type: 'respawn', name: window.GameState.username });
}

// ==========================================
// 10. 메인 렌더링 물리루프 (모든 시뮬레이션)
// ==========================================
function animate() {
requestAnimationFrame(animate);
const time = performance.now();
const delta = Math.min((time - lastTime) / 1000, 0.1);
lastTime = time;

if (!window.GameState.isDead) {
// 자동 회복 (5초 비전투 시 초당 10씩)
if(window.GameState.hp < 100 && (time - window.GameState.lastHitTime > 5000)) {
window.GameState.hp += 10 * delta;
if(window.GameState.hp > 100) window.GameState.hp = 100;
document.getElementById('hud-hp').innerText = Math.floor(window.GameState.hp);
}

if(isShootingHeld && getCurWeapon().auto) tryShoot();

// 속도 처리 (기본속도 대폭 낮춤)
let baseSpeed = 150.0;
if(isCrouching) baseSpeed = 80.0;
else if(isSprinting) baseSpeed = 250.0;

velocity.x -= velocity.x * 12.0 * delta;
velocity.z -= velocity.z * 12.0 * delta;
velocity.y -= 35.0 * delta; // 중력 강화

direction.x = (Number(moveR) - Number(moveL)) + joyDir.x;
direction.z = (Number(moveB) - Number(moveF)) + joyDir.y;
if(direction.length() > 1.0) direction.normalize();

const isMoving = direction.lengthSq() > 0.1;
updateDynamicCrosshair(delta, isMoving);

velocity.x -= direction.x * baseSpeed * delta;
velocity.z -= direction.z * baseSpeed * delta;

camera.translateX(-velocity.x * delta);
camera.translateZ(-velocity.z * delta);
camera.position.y += velocity.y * delta;

// 지면 충돌 및 헤드밥, 앉기
let targetEyeY = isCrouching ? 0.8 : 1.7;
if (camera.position.y < targetEyeY) {
velocity.y = 0; camera.position.y = targetEyeY; canJump = true;
// 발소리 처리
if(isMoving) {
stepTimer -= delta;
if(stepTimer <= 0) { playSound('step'); stepTimer = isSprinting ? 0.25 : 0.4; }
}
}

// 맵 이탈 방지
if (camera.position.x > 145) camera.position.x = 145; if (camera.position.x < -145) camera.position.x = -145;
if (camera.position.z > 145) camera.position.z = 145; if (camera.position.z < -145) camera.position.z = -145;

// 정조준 줌인 (카타나는 적용 안 함)
const wp = getCurWeapon();
const targetFov = (isAiming && wp.type === 'ranged') ? 45 : 75;
camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 15 * delta);
camera.updateProjectionMatrix();

// 부드러운 반동 복귀
currentRecoil.lerp(recoilTarget, 20 * delta);
recoilTarget.lerp(new THREE.Vector3(0,0,0), 12 * delta);

if(myGunMesh && !window.GameState.isReloading) {
// 무기 화면 정렬 (정조준)
const targetX = (isAiming && wp.type === 'ranged') ? 0 : 0.2;
const targetY = (isAiming && wp.type === 'ranged') ? -0.15 : -0.25;

myGunMesh.position.x = THREE.MathUtils.lerp(myGunMesh.position.x, targetX, 20 * delta);

// 총기 호흡(Sway) 및 헤드밥
let swayY = 0;
if(isMoving && canJump) swayY = Math.sin(time*(isSprinting?0.02:0.012)) * (isSprinting?0.02:0.01);
else swayY = Math.sin(time*0.003)*0.003;

myGunMesh.position.y = targetY + swayY + currentRecoil.y;
myGunMesh.position.z = -0.4 + currentRecoil.z;
myGunMesh.rotation.x = currentRecoil.x;
}
}

// 시각물 수명 처리
for(let i = tracers.length-1; i>=0; i--) {
tracers[i].life -= delta * 5;
if(tracers[i].life <= 0) { scene.remove(tracers[i].mesh); tracers.splice(i, 1); }
else tracers[i].mesh.material.opacity = tracers[i].life;
}
for(let i = particles.length-1; i>=0; i--) {
const p = particles[i]; p.vel.y -= 25 * delta;
p.mesh.position.addScaledVector(p.vel, delta); p.life -= delta * 3;
if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
}
for(let i = damageTexts.length-1; i>=0; i--) {
const dt = damageTexts[i]; dt.sprite.position.y += delta*1.5; dt.life -= delta * 1.5;
if(dt.life <= 0) { scene.remove(dt.sprite); damageTexts.splice(i, 1); }
else dt.sprite.material.opacity = dt.life;
}
for(let i = decals.length-1; i>=0; i--) {
decals[i].life -= delta;
if(decals[i].life <= 0) { scene.remove(decals[i].mesh); decals.splice(i, 1); }
else if(decals[i].life < 1.0) decals[i].mesh.material.opacity = decals[i].life;
}

if(composer) composer.render();
}
</script>
